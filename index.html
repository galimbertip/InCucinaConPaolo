<!DOCTYPE html>
<!--
  In Cucina con Paolo — GPverse
  Cronologia versioni (schema V.major.minor.patch)

  v1.2.0 — 22 ottobre 2026
    - Controllo automatico delle dosi sul testo originale dopo la
      conversione AI (es. "1 cucchiaio di latte" non diventa più 2).
    - Import da link più robusto quando il sito blocca la lettura.
    - Nutrizionista: valori a porzione e per 100 g, % giornaliera, fonti
      delle calorie, porzioni per pasto/spuntino, sezione diabetici
      (carboidrati, indice e carico glicemico), 14 allergeni UE.
    - Profilo alimentare con avvisi personalizzati e alternative.

  v1.1.0 — 22 ottobre 2026
    - Ricette dinamiche: campo persone digitabile (oltre a − / +) con
      ricalcolo immediato di tutte le dosi, anche dentro i passaggi.
    - Persone predefinite in Impostazioni (ricette già calcolate all'apertura).
    - Scelta delle persone anche in modalità cucina (mise en place).
    - Avviso che tempi e teglie possono cambiare con dosi ricalcolate.

  v1.0.0 — 22 ottobre 2026
    - Prima versione.
    - Formato ricetta unico per tutte le ricette: scheda (tempi, porzioni
      scalabili, difficoltà), "Prima di iniziare" (attrezzatura + punti
      critici), ingredienti raggruppati per preparazione e in ordine d'uso
      con spunta per la mise en place, procedimento a fasi con dosi dentro
      ogni passaggio, tempo, temperatura e "è pronto quando…".
    - Crea/modifica ricette con testo e foto (copertina e foto dei passaggi).
    - Importa da link: siti di ricette (lettura dei dati strutturati della
      pagina), YouTube (analisi del video con l'AI, con salto al punto
      giusto del video per ogni passaggio), TikTok, Instagram, Facebook;
      in alternativa da testo incollato o da foto/screenshot.
    - Svuota frigo: ingredienti, strumenti, tempo e persone → idee, con
      "Altre idee" per rifare la ricerca e "Fammi la ricetta".
    - Modalità cucina: un passaggio per schermata, schermo sempre acceso,
      timer, pulsante "Aiuto!" quando qualcosa va storto.
    - App installabile (icona, funziona offline), backup ed esportazione.
-->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In Cucina con Paolo — GPverse</title>
<meta name="description" content="Il ricettario di Paolo: crea, importa da link e video, svuota frigo.">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="In Cucina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4fa; --panel:#ffffff; --panel-2:#e6f0f8; --text:#0f1b2d; --dim:#56697f;
  --line:rgba(15,27,45,.12); --accent:#0a7f93; --accent-2:#2952e3; --violet:#6b4fe0;
  --ok:#1a8a5a; --warn:#b26a00; --warn-bg:#fff4e0; --bad:#c23b4a;
  --on-accent:#ffffff; --shadow:0 6px 24px rgba(15,27,45,.08);
  --mast-1:#05070f; --mast-2:#0d1326;
  --r:16px; --nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070a13; --panel:#111829; --panel-2:#18213a; --text:#eaf3fb; --dim:#93a8c6;
    --line:rgba(234,243,251,.11); --accent:#3fe0f0; --accent-2:#5b8cff; --violet:#a58bff;
    --ok:#4fd39a; --warn:#ffbe5c; --warn-bg:rgba(255,190,92,.1); --bad:#ff7383;
    --on-accent:#04121a; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#070a13; --panel:#111829; --panel-2:#18213a; --text:#eaf3fb; --dim:#93a8c6;
  --line:rgba(234,243,251,.11); --accent:#3fe0f0; --accent-2:#5b8cff; --violet:#a58bff;
  --ok:#4fd39a; --warn:#ffbe5c; --warn-bg:rgba(255,190,92,.1); --bad:#ff7383;
  --on-accent:#04121a; --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
h1,h2,h3,h4,.brand,.btn,.chip,.nav a,.meta-pill,.stepnum{font-family:"Space Grotesk",system-ui,sans-serif}
h1{font-size:1.75rem;line-height:1.15;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;letter-spacing:-.005em}
h3{font-size:1.02rem;margin:0 0 .4em}
a{color:var(--accent)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.dim{color:var(--dim)}
.small{font-size:.88rem}

/* Masthead */
.mast{background:radial-gradient(120% 140% at 50% 0%,var(--mast-2),var(--mast-1));color:#eaf3fb;padding:calc(var(--safe-t) + 10px) 0 12px;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(63,224,240,.18)}
.mast .wrap{display:flex;align-items:center;gap:12px}
.mast img{width:46px;height:36px;object-fit:cover;border-radius:8px}
.brand{font-weight:700;font-size:1.08rem;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#3fe0f0;opacity:.85}
.mast .back{margin-left:auto}
.mast .iconbtn{color:#eaf3fb;border-color:rgba(234,243,251,.2)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center;padding:0 6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:500;color:var(--dim);text-decoration:none;padding:6px 0}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--accent)}
.nav a.fab{justify-self:center}
.nav a.fab span.b{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--on-accent);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-18px}
.nav a.fab svg{width:26px;height:26px}

/* Generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;padding:11px 16px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;min-height:46px;transition:transform .08s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--text);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.sm svg{width:16px;height:16px}
.iconbtn.on{color:#f5b800}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--dim);margin:0 0 4px}
input[type=text],input[type=url],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500;cursor:pointer;user-select:none;line-height:1.2}
.chip.on{background:color-mix(in srgb,var(--accent) 18%,var(--panel));border-color:var(--accent);color:var(--text)}
.chip .x{opacity:.6;font-weight:700}
.chip svg{width:14px;height:14px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-family:"Space Grotesk",system-ui,sans-serif;font-size:.88rem;cursor:pointer;color:var(--dim)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:.92rem}
.notice b{color:var(--warn)}
.info{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:.92rem}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.sectionhead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sectionhead h2{margin:0}
.sectionhead .num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:.9rem;background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--on-accent)}
.sectionhead .aside{margin-left:auto}

/* Home */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.quick a{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.quick a svg{width:26px;height:26px;color:var(--accent)}
.quick a b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:.95rem;line-height:1.15}
.quick a span{font-size:.78rem;color:var(--dim);line-height:1.25}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--dim)}
.search input{padding-left:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.rcard .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--mast-2),#1b2a52);position:relative}
.rcard .ph img{width:100%;height:100%;object-fit:cover}
.rcard .ph .fav{position:absolute;top:8px;right:8px;color:#f5b800;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.rcard .ph .fav svg{width:20px;height:20px}
.rcard .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#3fe0f0;opacity:.6}
.rcard .ph .noimg svg{width:44px;height:44px}
.rcard .bd{padding:10px 12px 12px}
.rcard h3{font-size:.98rem;line-height:1.2;margin:0 0 6px}
.rcard .m{font-size:.78rem;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}

/* Recipe view */
.hero{margin:0 -16px;aspect-ratio:16/10;max-height:420px;background:linear-gradient(135deg,var(--mast-2),#1b2a52);position:relative;overflow:hidden}
@media (min-width:812px){.hero{margin:14px 0 0;border-radius:var(--r)}}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#3fe0f0;opacity:.55}
.hero .noimg svg{width:80px;height:80px}
.metarow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.meta-pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:.84rem;font-weight:500}
.meta-pill svg{width:16px;height:16px;color:var(--accent)}
.meta-pill b{font-weight:700}
.servings{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.servings .v{min-width:92px;text-align:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600}
.servings .serv-in{width:64px;min-height:36px;padding:4px 6px;text-align:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1.05rem;-moz-appearance:textfield}
.servings .serv-in::-webkit-outer-spin-button,.servings .serv-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.servings .u{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;margin-right:4px}
.actions{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin:14px 0}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.checklist li:last-child{border-bottom:0}
.checklist .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.checklist .box svg{width:15px;height:15px;opacity:0;color:var(--on-accent)}
.checklist li.done .box{background:var(--ok);border-color:var(--ok)}
.checklist li.done .box svg{opacity:1}
.checklist li.done .t{opacity:.5;text-decoration:line-through}
.qty{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;white-space:nowrap}
.est{color:var(--warn);font-weight:700;margin-right:1px}
.prep{color:var(--dim)}
.opt{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--dim)}
.group-name{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 2px}
.group-name:first-child{margin-top:0}
.phase{margin-top:18px}
.phase:first-child{margin-top:0}
.phase-title{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phase-title:before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--accent),var(--violet))}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.stepnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:.92rem;cursor:pointer}
.step.done .stepnum{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
.step.done .st{opacity:.55}
.step .st{margin:4px 0 0}
.step .uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.use{font-size:.83rem;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:8px;padding:3px 8px}
.step .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;font-family:"Space Grotesk",system-ui,sans-serif;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:default;text-decoration:none;color:var(--text)}
.badge svg{width:14px;height:14px}
button.badge{cursor:pointer}
.badge.timer{color:var(--accent)}
.badge.video{color:var(--bad)}
.cue{margin-top:8px;padding:8px 11px;border-radius:10px;background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-left:3px solid var(--ok);font-size:.92rem}
.cue b{color:var(--ok)}
.step img.sp{margin-top:10px;border-radius:12px;max-height:280px;object-fit:cover;width:100%}
.critical{display:grid;gap:10px}
.crit{padding:12px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.crit .p{font-weight:700;display:flex;gap:8px;align-items:flex-start}
.crit .p svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:2px}
.crit .fx{margin:4px 0 0 26px;font-size:.93rem}
.prose{white-space:pre-wrap}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.stars{display:inline-flex;gap:2px;color:#f5b800}
.stars svg{width:16px;height:16px}

/* Nutrizione */
.nutri-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutri-kpi div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.nutri-kpi b{display:block;font-family:"Space Grotesk",system-ui,sans-serif;font-size:1.15rem;color:var(--accent)}
.nutri-kpi span{font-size:.72rem;color:var(--dim)}
table.nutri{width:100%;border-collapse:collapse;font-size:.92rem}
table.nutri th{text-align:right;font-weight:600;color:var(--dim);font-size:.78rem;padding:6px 4px;border-bottom:2px solid var(--line)}
table.nutri td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.nutri td:first-child,table.nutri th:first-child{text-align:left}
table.nutri tr.sub td:first-child{padding-left:18px;color:var(--dim)}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:.86rem}
.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--violet))}
.advice{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.advice .lbl{display:flex;gap:6px;align-items:flex-start;font-weight:700;font-family:"Space Grotesk",system-ui,sans-serif;font-size:.86rem}
.advice .lbl svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}
.diab{border-radius:12px;padding:12px;background:var(--panel-2);border:1px solid var(--line)}
.diab.me{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.gi-ok b{color:var(--ok)} .gi-mid b{color:var(--warn)} .gi-hi b{color:var(--bad)}
.chip.al-yes{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-bg)}
.chip.al-tr{border-style:dashed}
.chip.al-me{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel));font-weight:700}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.no{opacity:.7;text-decoration:line-through}
.prof-alert{margin-top:12px;border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);font-size:.93rem}
.prof-alert b{color:var(--bad)}

/* Editor */
.ed-sec{margin-top:18px}
.ed-sec>h2{display:flex;align-items:center;gap:8px}
.ed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ed-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.ed-grid4{grid-template-columns:repeat(2,1fr)}}
.ing-row{display:grid;grid-template-columns:72px 76px 1fr auto;gap:6px;align-items:center;margin-top:8px}
.ing-row .prepin{grid-column:1/4}
.ing-row input{min-height:40px;padding:8px 9px}
.ing-tools{display:flex;gap:4px;grid-row:span 2;flex-direction:column}
.ed-ing{border-bottom:1px dashed var(--line);padding-bottom:8px}
.ed-group{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg)}
.ed-step{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--panel)}
.ed-step .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ed-step .hd .stepnum{width:30px;height:30px;font-size:.85rem;cursor:default}
.photo-pick{position:relative;border:2px dashed var(--line);border-radius:14px;min-height:120px;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--dim);background:var(--bg)}
.photo-pick img{width:100%;max-height:260px;object-fit:cover}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-pick .lbl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;padding:12px;text-align:center}
.photo-pick .lbl svg{width:28px;height:28px}
.mini-photo{display:flex;gap:8px;align-items:center;margin-top:8px}
.mini-photo img{width:72px;height:54px;object-fit:cover;border-radius:8px}
.savebar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:20;display:flex;gap:10px;margin-top:20px;padding:10px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.savebar .btn{flex:1}

/* Import */
.steps-log{list-style:none;padding:0;margin:12px 0 0;font-size:.92rem}
.steps-log li{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.steps-log .ic{width:20px;height:20px;flex:none;display:grid;place-items:center;margin-top:1px}
.steps-log .ic svg{width:18px;height:18px}
.steps-log .ok{color:var(--ok)} .steps-log .ko{color:var(--bad)} .steps-log .run{color:var(--accent)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.platforms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

/* Fridge */
.idea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.idea h3{font-size:1.08rem;margin-bottom:4px}
.idea .why{font-size:.9rem;color:var(--dim);margin-top:6px}
.idea .miss{font-size:.88rem;margin-top:6px}
.idea .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chipinput{display:flex;gap:8px}
.chipinput input{flex:1}

/* Cooking mode */
.cook{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.cook .top{display:flex;align-items:center;gap:10px;padding:10px 16px}
.cook .top .t{flex:1;min-width:0}
.cook .top .t b{display:block;font-family:"Space Grotesk",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook .bar{height:4px;background:var(--line);margin:0 16px;border-radius:2px;overflow:hidden}
.cook .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .25s}
.cook .body{flex:1;overflow:auto;padding:18px 16px 24px;max-width:780px;width:100%;margin:0 auto}
.cook .phase-l{font-family:"Space Grotesk",system-ui,sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cook .big{font-size:1.45rem;line-height:1.4;margin:10px 0 14px;font-weight:600}
.cook .bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);max-width:780px;width:100%;margin:0 auto}
.cook .bottom .btn{min-height:58px;font-size:1.05rem}
.cook .help{position:absolute;right:16px;bottom:calc(96px + var(--safe-b));border-radius:999px;background:var(--bad);color:#fff;border:0;padding:12px 18px;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;box-shadow:0 6px 20px rgba(194,59,74,.4);cursor:pointer;display:flex;gap:6px;align-items:center}
.cook .help svg{width:18px;height:18px}
.rate{display:flex;gap:8px;justify-content:center;margin:16px 0}
.rate button{background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:#f5b800}
.rate svg{width:40px;height:40px}

/* Timers bar */
.timers{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
body.cooking .timers{bottom:auto;top:calc(var(--safe-t) + 74px)}
.tmr{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--mast-1);color:#eaf3fb;border:1px solid rgba(63,224,240,.35);border-radius:999px;padding:7px 8px 7px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:"Space Grotesk",system-ui,sans-serif;max-width:92vw}
.tmr .lb{font-size:.8rem;opacity:.75;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr .tm{font-weight:700;font-size:1.05rem;color:#3fe0f0;font-variant-numeric:tabular-nums}
.tmr.ring{background:#c23b4a;border-color:#ff9aa5;animation:pulse 1s infinite}
.tmr.ring .tm{color:#fff}
.tmr button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
.tmr button svg{width:15px;height:15px}
@keyframes pulse{50%{transform:scale(1.04)}}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:200;background:rgba(3,6,14,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.modal{align-items:center;padding:20px}}
.modal .sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media (min-width:640px){.modal .sheet{border-radius:20px}}
.modal .sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .sheet .hd h2{margin:0;flex:1}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%);z-index:300;background:var(--mast-1);color:#eaf3fb;padding:10px 16px;border-radius:12px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:92vw;border:1px solid rgba(63,224,240,.3)}
.ai-answer ul{padding-left:20px;margin:6px 0}
.ai-answer p{margin:6px 0}
.version-list{font-size:.9rem}
.version-list h4{margin:10px 0 2px;font-family:"Space Grotesk",system-ui,sans-serif}
.version-list ul{margin:0;padding-left:18px}
.kbd{font-family:ui-monospace,monospace;font-size:.85em;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>

const $ = (s, el = document) => el.querySelector(s);

function fmtMin(m) {
  m = Math.round(+m || 0);
  if (!m) return '';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');
}
function totalMin(r) { return (+r.times.prep || 0) + (+r.times.cook || 0) + (+r.times.rest || 0); }
const FRAC = { 0.25: '¼', 0.5: '½', 0.75: '¾', 0.33: '⅓', 0.67: '⅔' };
function fmtQty(q, unit) {
  if (q == null || q === '' || isNaN(q)) return '';
  q = +q;
  const u = (unit || '').toLowerCase();
  let out;
  if (['g', 'ml', 'gr'].includes(u)) {
    out = q >= 100 ? Math.round(q / 5) * 5 : q >= 10 ? Math.round(q) : Math.round(q * 10) / 10;
  } else if (['kg', 'l'].includes(u)) {
    out = Math.round(q * 100) / 100;
  } else {
    const whole = Math.floor(q), rest = q - whole;
    const steps = [0, 0.25, 0.33, 0.5, 0.67, 0.75, 1];
    let best = 0; steps.forEach((s) => { if (Math.abs(rest - s) < Math.abs(rest - best)) best = s; });
    if (best === 1) return String(whole + 1);
    if (best === 0) return String(whole || (q > 0 ? Math.round(q * 100) / 100 : 0)).replace('.', ',');
    return (whole ? whole : '') + FRAC[best];
  }
  return String(out).replace('.', ',');
}
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

/* ---------- database (IndexedDB) ---------- */
const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open('incucina', 1);
      rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', { keyPath: 'id' }); };
      rq.onsuccess = () => { this._db = rq.result; res(this._db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('recipes', mode); const st = t.objectStore('recipes');
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  all() { return this.tx('readonly', (s) => s.getAll()); },
  get(id) { return this.tx('readonly', (s) => s.get(id)); },
  put(r) { return this.tx('readwrite', (s) => s.put(r)); },
  del(id) { return this.tx('readwrite', (s) => s.delete(id)); },
  clear() { return this.tx('readwrite', (s) => s.clear()); }
};

/* ---------- formato ricetta ----------
   Struttura unica di ogni ricetta dell'app:
   scheda (titolo, foto, descrizione, porzioni, tempi, difficoltà)
   → Prima di iniziare (attrezzatura, punti critici "Occhio a")
   → Ingredienti (per gruppo, in ordine d'uso, con preparazione)
   → Procedimento (fasi → passaggi con dosi, tempo, temperatura, segnale di pronto, foto)
   → Note, conservazione, fonte, diario.
*/
function blankRecipe() {
  return {
    id: uid(), createdAt: Date.now(), updatedAt: Date.now(),
    title: '', description: '', photo: '', category: 'primo', difficulty: 'facile', tags: [],
    servings: { amount: 4, unit: 'persone' },
    times: { prep: 0, cook: 0, rest: 0 },
    equipment: [],
    components: [{ id: uid(), name: '', ingredients: [] }],
    phases: [{ id: uid(), name: '', steps: [] }],
    critical: [], notes: '', storage: '',
    source: { type: 'manual', url: '', author: '', videoId: '' },
    favorite: false, log: [], warnings: []
  };
}
function newIng(o = {}) { return { id: uid(), qty: o.qty ?? null, unit: o.unit || '', name: o.name || '', prep: o.prep || '', optional: !!o.optional, estimated: !!o.estimated }; }
function newStep(o = {}) { return { id: uid(), text: o.text || '', minutes: o.minutes ?? null, temp: o.temp || '', cue: o.cue || '', photo: o.photo || '', videoAt: o.videoAt ?? null, uses: o.uses || [] }; }
function num(v) { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }

function normalizeRecipe(r) {
  const b = blankRecipe();
  const o = Object.assign(b, r || {});
  o.servings = Object.assign({ amount: 4, unit: 'persone' }, o.servings || {});
  o.servings.amount = num(o.servings.amount) || 4;
  o.times = Object.assign({ prep: 0, cook: 0, rest: 0 }, o.times || {});
  ['prep', 'cook', 'rest'].forEach((k) => (o.times[k] = num(o.times[k]) || 0));
  o.tags = Array.isArray(o.tags) ? o.tags.filter(Boolean) : [];
  o.equipment = Array.isArray(o.equipment) ? o.equipment.filter(Boolean) : [];
  o.components = (Array.isArray(o.components) && o.components.length ? o.components : [{ name: '', ingredients: [] }]).map((c) => ({
    id: c.id || uid(), name: c.name || '', ingredients: (c.ingredients || []).map((i) => Object.assign(newIng(i), { id: i.id || uid(), qty: num(i.qty) }))
  }));
  o.phases = (Array.isArray(o.phases) && o.phases.length ? o.phases : [{ name: '', steps: [] }]).map((p) => ({
    id: p.id || uid(), name: p.name || '', steps: (p.steps || []).map((s) => Object.assign(newStep(s), { id: s.id || uid(), minutes: num(s.minutes), videoAt: num(s.videoAt), uses: Array.isArray(s.uses) ? s.uses : [] }))
  }));
  o.critical = (o.critical || []).filter((c) => c && (c.problem || c.fix)).map((c) => ({ problem: c.problem || '', fix: c.fix || '' }));
  o.source = Object.assign({ type: 'manual', url: '', author: '', videoId: '' }, o.source || {});
  o.log = Array.isArray(o.log) ? o.log : [];
  o.warnings = Array.isArray(o.warnings) ? o.warnings : [];
  if (!CATEGORIES.includes(o.category)) o.category = 'altro';
  if (!DIFFICULTIES.includes(o.difficulty)) o.difficulty = 'media';
  return o;
}
function allIngredients(r) { return r.components.flatMap((c) => c.ingredients); }
function findIng(r, id) { return allIngredients(r).find((i) => i.id === id); }

/* Collega gli ingredienti citati in un passaggio (per nome) agli ingredienti della ricetta */
function matchIngredient(r, name) {
  const n = normTxt(name); if (!n) return null;
  const list = allIngredients(r);
  let best = null, score = 0;
  for (const i of list) {
    const m = normTxt(i.name); if (!m) continue;
    let s = 0;
    if (m === n) s = 100;
    else if (m.includes(n) || n.includes(m)) s = 60 + Math.min(m.length, n.length);
    else {
      const a = new Set(n.split(' ').filter((w) => w.length > 2)), bw = m.split(' ').filter((w) => w.length > 2);
      const common = bw.filter((w) => a.has(w)).length; if (common) s = 20 + common * 10;
    }
    if (s > score) { score = s; best = i; }
  }
  return score >= 30 ? best : null;
}

/* Converte la risposta dell'AI (formato semplice) nel formato completo dell'app */
function fromAiRecipe(a, extra = {}) {
  const r = blankRecipe();
  r.title = a.title || 'Ricetta senza titolo';
  r.description = a.description || '';
  r.category = CATEGORIES.includes(a.category) ? a.category : 'altro';
  r.difficulty = DIFFICULTIES.includes(a.difficulty) ? a.difficulty : 'media';
  r.servings = { amount: num(a.servings) || 4, unit: a.servingsUnit || 'persone' };
  r.times = { prep: num(a.prepMinutes) || 0, cook: num(a.cookMinutes) || 0, rest: num(a.restMinutes) || 0 };
  r.tags = Array.isArray(a.tags) ? a.tags.slice(0, 8) : [];
  r.equipment = Array.isArray(a.equipment) ? a.equipment : [];
  r.components = (a.components && a.components.length ? a.components : [{ name: '', ingredients: a.ingredients || [] }]).map((c) => ({
    id: uid(), name: c.name || '', ingredients: (c.ingredients || []).map((i) => newIng({ qty: num(i.qty), unit: i.unit || '', name: i.name || '', prep: i.prep || '', optional: i.optional, estimated: i.estimated }))
  }));
  r.phases = (a.phases && a.phases.length ? a.phases : [{ name: '', steps: a.steps || [] }]).map((p) => ({
    id: uid(), name: p.name || '', steps: (p.steps || []).map((s) => {
      const st = newStep({ text: typeof s === 'string' ? s : s.text, minutes: num(s.minutes), temp: s.temp || '', cue: s.cue || '', videoAt: num(s.videoAt) });
      st.uses = [];
      (s.uses || []).forEach((u) => {
        const ing = matchIngredient(r, typeof u === 'string' ? u : u.name);
        if (ing && !st.uses.some((x) => x.ing === ing.id)) {
          const q = num(u.qty);
          st.uses.push({ ing: ing.id, qty: q != null && ing.qty != null && Math.abs(q - ing.qty) > 0.001 ? q : null });
        }
      });
      return st;
    })
  }));
  r.critical = (a.critical || []).map((c) => ({ problem: c.problem || '', fix: c.fix || '' }));
  r.notes = a.notes || '';
  r.storage = a.storage || '';
  r.warnings = Array.isArray(a.warnings) ? a.warnings : [];
  r.source = Object.assign(r.source, { author: a.author || '' }, extra.source || {});
  if (extra.photo) r.photo = extra.photo;
  return normalizeRecipe(r);
}

/* Lettura di una riga ingrediente tipo "200 g farina 00, setacciata" o "Spaghetti 320 g" */
const UNIT_RX = '(kg|g|gr|grammi|mg|ml|cl|dl|l|litri?|cucchiai(?:ni)?|cucchiaio|cucchiaino|cucch\\.?|tazz[ae]|bicchier[ei]|pizzic[oh]i?|spicchi?o?|fogli[ae]|fett[ae]|mazzett[oi]|rametti?o?|pz|pezzi|cups?|tbsp|tsp|oz|lb|q\\.?\\s?b\\.?)';
function parseFraction(s) {
  if (!s) return null;
  s = s.replace('½', '.5').replace('¼', '.25').replace('¾', '.75').trim();
  if (/^\d+\/\d+$/.test(s)) { const [a, b] = s.split('/'); return +a / +b; }
  if (/^\d+\s+\d+\/\d+$/.test(s)) { const [w, f] = s.split(/\s+/); const [a, b] = f.split('/'); return +w + +a / +b; }
  return num(s);
}
function cleanUnit(u) {
  if (!u) return '';
  u = u.toLowerCase().replace(/\s/g, '');
  if (/^q\.?b\.?$/.test(u)) return 'q.b.';
  if (u === 'gr' || u === 'grammi') return 'g';
  if (/^litr/.test(u)) return 'l';
  if (/^cucchiain/.test(u)) return 'cucchiaino';
  if (/^cucch/.test(u)) return 'cucchiaio';
  if (/^tazz/.test(u)) return 'tazza';
  if (/^pizzic/.test(u)) return 'pizzico';
  if (/^spicch/.test(u)) return 'spicchio';
  if (/^fogli/.test(u)) return 'foglia';
  if (/^fett/.test(u)) return 'fetta';
  if (/^mazzett/.test(u)) return 'mazzetto';
  if (u === 'pezzi') return 'pz';
  return u;
}
function parseIngredientLine(line) {
  let s = String(line).replace(/^[\s•\-–*·]+/, '').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  let prep = '';
  const ci = s.indexOf(',');
  let m;
  const NUM = '(\\d+(?:[.,]\\d+)?(?:\\s+\\d+\\/\\d+)?|\\d+\\/\\d+|[½¼¾])';
  // "200 g di farina, setacciata"
  if ((m = s.match(new RegExp('^' + NUM + '\\s*' + UNIT_RX + '?\\.?\\s+(?:di\\s+|d\')?(.+)$', 'i')))) {
    let name = m[3]; const c = name.indexOf(','); if (c > -1) { prep = name.slice(c + 1).trim(); name = name.slice(0, c); }
    return newIng({ qty: parseFraction(m[1]), unit: cleanUnit(m[2]), name: name.trim(), prep });
  }
  // "Spaghetti 320 g" / "Sale q.b."
  if (ci > -1) { prep = s.slice(ci + 1).trim(); s = s.slice(0, ci).trim(); }
  if ((m = s.match(new RegExp('^(.+?)\\s+' + NUM + '\\s*' + UNIT_RX + '?\\.?$', 'i')))) {
    return newIng({ name: m[1].trim(), qty: parseFraction(m[2]), unit: cleanUnit(m[3]), prep });
  }
  if ((m = s.match(/^(.+?)\s+(q\.?\s?b\.?)$/i))) return newIng({ name: m[1].trim(), unit: 'q.b.', prep });
  return newIng({ name: s, prep });
}

/* ---------- foto ---------- */
function compressImage(src, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { res(c.toDataURL('image/jpeg', q)); } catch (e) { rej(e); }
    };
    img.onerror = () => rej(new Error('immagine non leggibile'));
    img.src = src;
  });
}
function fileToDataURL(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
}
async function fileToPhoto(file, max = 1280) { return compressImage(await fileToDataURL(file), max); }
/* Scarica un'immagine da internet (tramite proxy) e la salva dentro la ricetta, così resta anche offline */
async function remoteToPhoto(url) {
  if (!url) return '';
  try {
    const blob = await proxyFetch(url, 'blob');
    if (!blob.type.startsWith('image')) throw new Error('non è un\'immagine');
    const data = await fileToDataURL(blob);
    return await compressImage(data);
  } catch { return url; }
}

/* ---------- accesso al web (proxy CORS pubblici) ---------- */
const PROXIES = [
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  (u) => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)
];
async function fetchTimeout(url, ms = 15000, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, Object.assign({ signal: ctl.signal }, opts)); } finally { clearTimeout(t); }
}
async function proxyFetch(url, as = 'text') {
  let last;
  for (const p of PROXIES) {
    try {
      const r = await fetchTimeout(p(url), 15000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const out = as === 'blob' ? await r.blob() : as === 'json' ? await r.json() : await r.text();
      if (as === 'text' && (!out || out.length < 200)) throw new Error('pagina vuota');
      return out;
    } catch (e) { last = e; }
  }
  throw last || new Error('non raggiungibile');
}

/* ---------- AI (Google Gemini, chiave personale) ---------- */
const AI = {
  key() { return settings.get('gemini_key', ''); },
  has() { return !!this.key(); },
  async models(force = false) {
    const cache = settings.get('gemini_models', null);
    if (!force && cache && Date.now() - cache.t < 3 * 864e5) return cache.list;
    const r = await fetchTimeout('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(this.key()), 15000);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(this.errMsg(r.status, j));
    const list = (j.models || []).filter((m) => (m.supportedGenerationMethods || []).includes('generateContent')).map((m) => m.name.replace(/^models\//, ''));
    settings.set('gemini_models', { t: Date.now(), list });
    return list;
  },
  pickBest(list) {
    const ok = list.filter((n) => /^gemini-/.test(n) && /flash/.test(n) && !/(lite|image|tts|audio|live|embed|thinking|8b|vision|robotics|computer)/.test(n));
    const ver = (n) => { const m = n.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
    ok.sort((a, b) => ver(b) - ver(a) || (/preview|exp/.test(a) ? 1 : 0) - (/preview|exp/.test(b) ? 1 : 0) || a.length - b.length);
    return ok[0] || list.find((n) => /flash/.test(n)) || 'gemini-2.5-flash';
  },
  async model() {
    const chosen = settings.get('gemini_model', 'auto');
    if (chosen && chosen !== 'auto') return chosen;
    try { return this.pickBest(await this.models()); } catch { return 'gemini-2.5-flash'; }
  },
  errMsg(status, j) {
    const m = (j && j.error && j.error.message) || '';
    if (status === 400 && /api key/i.test(m)) return 'La chiave AI non è valida: controllala in Impostazioni.';
    if (status === 403) return 'La chiave AI non ha i permessi (o è stata disattivata). Controllala in Impostazioni.';
    if (status === 429) return 'Hai raggiunto il limite gratuito di richieste per ora: aspetta un minuto e riprova.';
    if (status >= 500) return 'Il servizio AI di Google è momentaneamente sovraccarico: riprova tra poco.';
    return 'Errore AI (' + status + '): ' + (m || 'risposta non valida');
  },
  /* parts: [{text}|{inlineData}|{fileData}] — tools: ['google_search'|'url_context'] */
  async generate({ parts, system, tools = [], json = true, temperature = 0.4, _retry = 0 }) {
    if (!this.has()) throw Object.assign(new Error('Serve la chiave AI gratuita: inseriscila in Impostazioni.'), { code: 'nokey' });
    const model = await this.model();
    const body = { contents: [{ role: 'user', parts }], generationConfig: { temperature } };
    if (system) body.systemInstruction = { parts: [{ text: system }] };
    if (tools.length) body.tools = tools.map((t) => ({ [t]: {} }));
    else if (json) body.generationConfig.responseMimeType = 'application/json';
    const r = await fetchTimeout('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(this.key()), 150000, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const msg = (j.error && j.error.message) || '';
      if (r.status === 404 && !_retry) { settings.set('gemini_models', null); if (settings.get('gemini_model', 'auto') !== 'auto') settings.set('gemini_model', 'auto'); return this.generate({ parts, system, tools, json, temperature, _retry: 1 }); }
      if (r.status === 503 && _retry < 2) { await sleep(2500); return this.generate({ parts, system, tools, json, temperature, _retry: _retry + 1 }); }
      const e = new Error(this.errMsg(r.status, j)); e.status = r.status; e.raw = msg;
      e.toolProblem = tools.length > 0 && [400, 403, 429].includes(r.status);
      throw e;
    }
    const cand = (j.candidates || [])[0] || {};
    const text = ((cand.content && cand.content.parts) || []).map((p) => p.text || '').join('');
    if (!text) throw new Error(cand.finishReason === 'SAFETY' ? 'L\'AI ha rifiutato questo contenuto.' : 'L\'AI non ha restituito nulla, riprova.');
    const sources = ((cand.groundingMetadata && cand.groundingMetadata.groundingChunks) || []).map((c) => c.web).filter(Boolean);
    return { text, sources, data: json ? parseJsonLoose(text) : null };
  },
  /* Prova con gli strumenti web; se la chiave gratuita non li permette, riprova senza */
  async generateWithFallback(opts) {
    try { return Object.assign(await this.generate(opts), { usedTools: true }); }
    catch (e) {
      if (!e.toolProblem) throw e;
      return Object.assign(await this.generate(Object.assign({}, opts, { tools: [] })), { usedTools: false });
    }
  }
};
function parseJsonLoose(t) {
  if (!t) return null;
  let s = t.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(s); } catch {}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a > -1 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch {} }
  throw new Error('Non sono riuscito a leggere la risposta dell\'AI: riprova.');
}

const RECIPE_SCHEMA = `{

const RECIPE_RULES = `Sei il redattore del ricettario personale di Paolo: cuoco casalingo appassionato, senza scuola di cucina, che si spazientisce quando una ricetta non va come previsto. Il tuo compito è trasformare il materiale fornito in UNA ricetta chiarissima, in italiano, nel formato JSON indicato.
Regole:
- Resta fedele alla ricetta originale: non cambiare ingredienti né procedimento. Traduci in italiano se serve.
- Le dosi scritte nell'originale vanno copiate ESATTAMENTE (stesso numero, stessa unità, stesse porzioni): non arrotondarle, non raddoppiarle, non ricalcolarle. "servings" è il numero di persone indicato nell'originale.
- Dosi e tempi: se il materiale li dà, usali. Se mancano, stimali con buon senso, metti "estimated": true sull'ingrediente e scrivi un avviso in "warnings" (es. "Le dosi non sono dette nel video: sono stimate").
- Unità metriche (g, kg, ml, l, °C) e unità casalinghe italiane (cucchiaio, cucchiaino, pz, spicchio, pizzico, q.b.). Converti cup/oz/lb/°F. "qty" è sempre un numero (0.5, non "1/2"); per "quanto basta" usa unit "q.b." e qty null.
- Ingredienti: raggruppali per preparazione ("Per l'impasto", "Per la farcia"); se c'è una sola preparazione usa un unico gruppo con name "". Elencali nell'ordine in cui si usano. In "prep" scrivi come vanno preparati prima di iniziare (tritato fine, a temperatura ambiente, ...).
- Procedimento: dividi in fasi con titoli brevi e operativi. Ogni passaggio contiene UNA azione principale, con frasi brevi all'imperativo.
- In ogni passaggio: "minutes" per cotture/attese, "temp" per fuoco o forno (es. "180 °C statico", "fiamma bassa"), "cue" con il segnale concreto che ti dice che puoi andare avanti (colore, consistenza, profumo, prova dello stecchino), "uses" con gli ingredienti usati in quel passaggio e la dose usata lì.
- "critical": 2-4 punti in cui QUESTA ricetta tipicamente va storta, ciascuno con il rimedio pratico immediato.
- "equipment": tutti gli strumenti necessari, con misure quando contano.
- Se il materiale non contiene una ricetta, rispondi solo {"notARecipe": true, "warnings": ["perché"]}.
- Se il materiale contiene PIÙ ricette diverse (raccolta, galleria, elenco) e non ti è stato detto quale scegliere, rispondi solo {"multiple": true, "titles": ["titolo ricetta 1", "titolo ricetta 2", ...]}.
Rispondi SOLO con il JSON, senza testo prima o dopo.
Formato:
` + RECIPE_SCHEMA;

/* ---------- import da link ---------- */
function detectPlatform(url) {
  let u; try { u = new URL(url); } catch { return null; }
  const h = u.hostname.replace(/^www\.|^m\./, '');
  if (/(^|\.)youtube\.com$|^youtu\.be$/.test(h)) {
    let id = '';
    if (h === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (u.searchParams.get('v')) id = u.searchParams.get('v');
    else { const m = u.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{6,})/); if (m) id = m[2]; }
    return { type: 'youtube', id, url: id ? 'https://www.youtube.com/watch?v=' + id : url };
  }
  if (/tiktok\.com$/.test(h)) return { type: 'tiktok', url };
  if (/instagram\.com$/.test(h)) return { type: 'instagram', url };
  if (/(facebook\.com|fb\.watch|fb\.com)$/.test(h)) return { type: 'facebook', url };
  return { type: 'web', url };
}
const PLATFORM_NAME = { web: 'Sito web', youtube: 'YouTube', tiktok: 'TikTok', instagram: 'Instagram', facebook: 'Facebook', photo: 'Foto', text: 'Testo', ai: 'Svuota frigo', manual: 'Ricetta mia' };

function isoDur(s) {
  if (!s || typeof s !== 'string') return 0;
  const m = s.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  if (!m) return 0;
  return (+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
function findJsonLdRecipe(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const found = [];
  const walk = (o) => {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(walk);
    const t = o['@type']; const types = Array.isArray(t) ? t : [t];
    if (types.includes('Recipe')) found.push(o);
    if (o['@graph']) walk(o['@graph']);
    if (o.mainEntity) walk(o.mainEntity);
  };
  $$('script[type="application/ld+json"]', doc).forEach((s) => { try { walk(JSON.parse(s.textContent.trim())); } catch {} });
  const meta = (p) => { const m = doc.querySelector(`meta[property="${p}"],meta[name="${p}"]`); return m ? m.getAttribute('content') : ''; };
  // testo leggibile della pagina, per l'AI
  $$('script,style,noscript,svg,iframe,header,footer,nav,form,aside', doc).forEach((n) => n.remove());
  $$('br', doc).forEach((n) => n.replaceWith('\n'));
  $$('p,li,div,h1,h2,h3,h4,h5,h6,tr,dt,dd,section,article,figcaption,blockquote', doc).forEach((n) => n.append('\n'));
  const text = (doc.body ? doc.body.textContent : '').replace(/\s+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+/g, ' ').trim().slice(0, 40000);
  return { recipe: found[0] || null, ogImage: meta('og:image'), ogTitle: meta('og:title'), ogDesc: meta('og:description') || meta('description'), text };
}
function ldImage(img) {
  if (!img) return '';
  if (typeof img === 'string') return img;
  if (Array.isArray(img)) return ldImage(img[0]);
  return img.url || img.contentUrl || '';
}
function ldText(x) { if (!x) return ''; return (new DOMParser().parseFromString(String(x), 'text/html').body.textContent || '').trim(); }
/* Ricetta da dati strutturati (schema.org) senza AI */
function fromJsonLd(ld, url) {
  const r = blankRecipe();
  r.title = ldText(ld.name) || 'Ricetta';
  r.description = ldText(ld.description).slice(0, 400);
  const y = Array.isArray(ld.recipeYield) ? ld.recipeYield[0] : ld.recipeYield;
  r.servings.amount = num(String(y || '').match(/\d+/)?.[0]) || 4;
  r.times = { prep: isoDur(ld.prepTime), cook: isoDur(ld.cookTime), rest: 0 };
  if (!r.times.prep && !r.times.cook) r.times.prep = isoDur(ld.totalTime);
  r.components[0].ingredients = (ld.recipeIngredient || ld.ingredients || []).map((l) => parseIngredientLine(ldText(l))).filter(Boolean);
  const phases = [];
  const addSteps = (list, name) => {
    const ph = { id: uid(), name: name || '', steps: [] };
    (Array.isArray(list) ? list : [list]).forEach((s) => {
      if (!s) return;
      if (typeof s === 'string') ldText(s).split(/\n+/).filter((x) => x.trim()).forEach((t) => ph.steps.push(newStep({ text: t.trim() })));
      else if (s['@type'] === 'HowToSection') addSteps(s.itemListElement, ldText(s.name));
      else ph.steps.push(newStep({ text: ldText(s.text || s.name), photo: ldImage(s.image) }));
    });
    if (ph.steps.length) phases.push(ph);
  };
  addSteps(ld.recipeInstructions || [], '');
  if (phases.length) r.phases = phases;
  r.tags = String(ld.keywords || '').split(',').map((s) => s.trim()).filter(Boolean).slice(0, 6);
  const au = Array.isArray(ld.author) ? ld.author[0] : ld.author;
  r.source = { type: 'web', url, author: (au && (au.name || au)) || '', videoId: '' };
  const cat = normTxt(Array.isArray(ld.recipeCategory) ? ld.recipeCategory[0] : ld.recipeCategory);
  r.category = CATEGORIES.find((c) => cat.includes(c.split(' ')[0])) || (/dessert|dolc/.test(cat) ? 'dolce' : /main|second/.test(cat) ? 'secondo' : 'altro');
  // collega gli ingredienti ai passaggi cercando il loro nome nel testo
  r.phases.forEach((p) => p.steps.forEach((s) => {
    const t = normTxt(s.text);
    allIngredients(r).forEach((i) => { const n = normTxt(i.name).split(' ')[0]; if (n.length > 3 && t.includes(n)) s.uses.push({ ing: i.id, qty: null }); });
  }));
  r.warnings = ['Importata senza AI: struttura base. Con la chiave AI ottieni fasi, segnali di cottura e punti critici.'];
  return normalizeRecipe(r);
}

async function importFromUrl(url, log) {
  const pf = detectPlatform(url);
  if (!pf) throw new Error('Il link non sembra valido.');
  if (pf.type === 'youtube') return importYouTube(pf, log);
  if (pf.type === 'web') return importWeb(pf.url, log);
  return importSocial(pf, log);
}

/* Controllo automatico delle dosi: confronta quelle scritte dall'AI con quelle del testo originale
   e, se non coincidono, rimette quelle originali (l'AI a volte sbaglia i numeri). */
function nameTokens(s) { return new Set(normTxt(s).split(' ').filter((w) => w.length > 2 && !['per', 'con', 'del', 'della', 'delle', 'dei', 'fresco', 'fresca', 'freschi'].includes(w))); }
function sourceIngredients(text) {
  return String(text || '').split(/\n|•/).map((l) => l.trim())
    .filter((l) => l && l.length < 120 && /(^\s*[-•*]?\s*(\d|½|¼|¾))|(\d+\s*(g|kg|ml|l|cl|gr)\b)|q\.?\s?b\.?$/i.test(l))
    .map((l) => parseIngredientLine(l)).filter((i) => i && i.name && i.qty != null);
}
function reconcileDoses(r, sourceText) {
  const src = sourceIngredients(sourceText);
  const fixes = [];
  const m = String(sourceText || '').match(/per\s+(\d+)\s+(persone|porzioni|pezzi)/i);
  if (m && +m[1] !== r.servings.amount) { fixes.push('porzioni ' + r.servings.amount + ' → ' + m[1]); r.servings.amount = +m[1]; }
  if (!src.length) return fixes;
  const used = new Set();
  allIngredients(r).forEach((ing) => {
    const a = nameTokens(ing.name); if (!a.size) return;
    let best = null, bestScore = 0, tie = false;
    src.forEach((sItem, idx) => {
      if (used.has(idx)) return;
      const b = nameTokens(sItem.name); let common = 0; a.forEach((w) => { if (b.has(w) || [...b].some((x) => x.startsWith(w.slice(0, 5)) && w.length > 4)) common++; });
      const score = common / (a.size + b.size - common);
      if (score > bestScore + 1e-9) { best = idx; bestScore = score; tie = false; } else if (Math.abs(score - bestScore) < 1e-9 && score > 0) tie = true;
    });
    if (best == null || tie || bestScore < 0.34) return;
    used.add(best);
    const sItem = src[best];
    const sameUnit = !sItem.unit || cleanUnit(sItem.unit) === cleanUnit(ing.unit) || (ing.unit === 'pz' && !sItem.unit);
    if (Math.abs((ing.qty ?? -1) - sItem.qty) > 0.001 || !sameUnit) {
      fixes.push(ing.name + ' ' + [fmtQty(ing.qty, ing.unit), unitLabel(ing.unit, ing.qty)].filter(Boolean).join(' ') + ' → ' + [fmtQty(sItem.qty, sItem.unit), unitLabel(sItem.unit || ing.unit, sItem.qty)].filter(Boolean).join(' '));
      ing.qty = sItem.qty; if (sItem.unit) ing.unit = sItem.unit;
    }
    ing.estimated = false;
  });
  // dosi parziali nei passaggi: mai più del totale
  r.phases.forEach((p) => p.steps.forEach((s) => s.uses.forEach((u) => { const i = findIng(r, u.ing); if (i && u.qty != null && (i.qty == null || u.qty > i.qty + 0.001)) u.qty = null; })));
  if (fixes.length) r.warnings.unshift('Dosi corrette automaticamente sul testo originale: ' + fixes.join('; ') + '.');
  return fixes;
}

async function importWeb(url, log, pick) {
  let page = null;
  const s1 = log('Leggo la pagina della ricetta');
  if (S.pageCache && S.pageCache.url === url) { page = S.pageCache.page; s1.ok('Pagina già letta'); }
  else {
    try { page = findJsonLdRecipe(await proxyFetch(url)); S.pageCache = { url, page }; s1.ok(page.recipe ? 'Trovati i dati della ricetta' : 'Pagina letta'); }
    catch { s1.ko('Non riesco ad aprire la pagina direttamente'); }
  }
  if (pick && page) page = Object.assign({}, page, { recipe: page.recipe && normTxt(ldText(page.recipe.name)).includes(normTxt(pick).slice(0, 20)) ? page.recipe : null });
  const pickTxt = pick ? '\nLa pagina contiene più ricette: estrai SOLO la ricetta "' + pick + '".' : '';

  const photoUrl = page ? ldImage(page.recipe && page.recipe.image) || page.ogImage : '';
  if (!AI.has()) {
    if (page && page.recipe) {
      const r = fromJsonLd(page.recipe, url);
      const s2 = log('Scarico la foto'); r.photo = await remoteToPhoto(photoUrl); s2.ok();
      return r;
    }
    throw Object.assign(new Error('Questa pagina non ha dati di ricetta leggibili: serve la chiave AI (gratuita) per convertirla. La trovi in Impostazioni.'), { code: 'nokey' });
  }
  const s3 = log('L\'AI la riscrive nel formato dell\'app');
  let res;
  if (page && (page.recipe || page.text.length > 300)) {
    const material = pickTxt + (page.recipe ? 'Dati strutturati della ricetta:\n' + JSON.stringify(page.recipe).slice(0, 30000) + '\n\nTesto della pagina (per consigli e dettagli):\n' + page.text.slice(0, 12000) : 'Testo della pagina:\n' + page.text);
    try { res = await AI.generate({ system: RECIPE_RULES, parts: [{ text: 'Fonte: ' + url + '\n\n' + material }] }); }
    catch (e) {
      if (!page.recipe) throw e;
      s3.ko(e.message);
      const r = fromJsonLd(page.recipe, url);
      r.warnings.unshift('L\'AI non ha risposto (' + e.message + '): importata con la struttura base.');
      const s5 = log('Scarico la foto'); r.photo = await remoteToPhoto(photoUrl); s5.ok();
      return r;
    }
  } else {
    res = await AI.generateWithFallback({ system: RECIPE_RULES, tools: ['url_context'], parts: [{ text: 'Leggi la ricetta a questo indirizzo e convertila: ' + url + pickTxt }] });
    if (!res.usedTools) throw new Error('Non riesco a leggere questa pagina (blocca l\'accesso). Copia il testo della ricetta e usa "Testo".');
  }
  if (res.data && res.data.multiple && Array.isArray(res.data.titles) && res.data.titles.length) {
    s3.ok('La pagina contiene ' + res.data.titles.length + ' ricette');
    throw Object.assign(new Error('Questa pagina è una raccolta di ricette: scegli quale importare.'), { code: 'multi', titles: res.data.titles.slice(0, 20), url });
  }
  if ((!res.data || res.data.notARecipe) && page) {
    // la pagina letta era probabilmente una schermata di blocco: chiedo all'AI di aprirla direttamente
    try { const r2 = await AI.generateWithFallback({ system: RECIPE_RULES, tools: ['url_context'], parts: [{ text: 'Leggi la ricetta a questo indirizzo e convertila: ' + url + pickTxt }] }); if (r2.usedTools) res = r2; } catch {}
  }
  if (!res.data || res.data.notARecipe) throw new Error('Non riesco a leggere la ricetta da questa pagina (il sito potrebbe bloccare l\'accesso). Copia il testo della ricetta e usa "Testo".');
  s3.ok();
  const r = fromAiRecipe(res.data, { source: { type: 'web', url } });
  if (page) reconcileDoses(r, page.recipe ? (page.recipe.recipeIngredient || []).map(ldText).join('\n') + '\n' + (page.recipe.recipeYield ? 'per ' + String(Array.isArray(page.recipe.recipeYield) ? page.recipe.recipeYield[0] : page.recipe.recipeYield).match(/\d+/)?.[0] + ' persone' : '') : page.text);
  const s4 = log('Scarico la foto');
  r.photo = await remoteToPhoto(photoUrl); s4.ok(r.photo ? '' : 'Nessuna foto trovata');
  return r;
}

async function importYouTube(pf, log) {
  if (!pf.id) throw new Error('Non riconosco il video YouTube in questo link.');
  const thumb = 'https://i.ytimg.com/vi/' + pf.id + '/hqdefault.jpg';
  if (!AI.has()) throw Object.assign(new Error('Per trasformare un video in ricetta serve la chiave AI (gratuita): inseriscila in Impostazioni.'), { code: 'nokey' });
  const s1 = log('L\'AI guarda il video (può volerci un minuto)');
  let res;
  try {
    res = await AI.generate({
      system: RECIPE_RULES + '\nPer ogni passaggio indica in "videoAt" il secondo del video in cui viene mostrato (numero intero). Usa anche quello che si vede, non solo il parlato.',
      parts: [{ fileData: { fileUri: pf.url } }, { text: 'Trasforma questa video ricetta nel formato richiesto.' }],
      temperature: 0.3
    });
  } catch (e) {
    s1.ko(e.message);
    // ripiego: titolo del video, la descrizione la incolla l'utente
    throw new Error(e.status === 429 ? e.message : 'Non riesco ad analizzare questo video (deve essere pubblico). Puoi copiare la descrizione del video e usare "Testo".');
  }
  if (!res.data || res.data.notARecipe) { s1.ko(); throw new Error('Nel video non ho trovato una ricetta.'); }
  s1.ok();
  const r = fromAiRecipe(res.data, { source: { type: 'youtube', url: pf.url, videoId: pf.id } });
  const s2 = log('Scarico la copertina e le foto dei passaggi');
  let cover = await remoteToPhoto('https://i.ytimg.com/vi/' + pf.id + '/maxresdefault.jpg');
  if (!cover || cover.startsWith('http')) cover = await remoteToPhoto(thumb);
  r.photo = cover;
  s2.ok();
  return r;
}

async function importSocial(pf, log) {
  const name = PLATFORM_NAME[pf.type];
  let caption = '', thumb = '', author = '';
  const s1 = log('Leggo il post di ' + name);
  try {
    if (pf.type === 'tiktok') {
      let j;
      try { const r = await fetchTimeout('https://www.tiktok.com/oembed?url=' + encodeURIComponent(pf.url), 12000); j = await r.json(); }
      catch { j = await proxyFetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(pf.url), 'json'); }
      caption = j.title || ''; thumb = j.thumbnail_url || ''; author = j.author_name || '';
    } else {
      const page = findJsonLdRecipe(await proxyFetch(pf.url));
      caption = [page.ogTitle, page.ogDesc].filter(Boolean).join('\n'); thumb = page.ogImage;
    }
    if (caption) s1.ok('Didascalia letta'); else s1.ko('Il post non mostra la didascalia');
  } catch { s1.ko(name + ' non lascia leggere il post da fuori'); }

  if (!AI.has()) throw Object.assign(new Error('Per convertire i post serve la chiave AI (gratuita): inseriscila in Impostazioni.'), { code: 'nokey' });
  const s2 = log('L\'AI ricava la ricetta');
  let res = null;
  const parts = [{ text: 'Post ' + name + ' (' + pf.url + ')' + (author ? ' di ' + author : '') + '.\nDidascalia:\n' + (caption || '(non disponibile)') }];
  if (thumb) {
    try {
      const blob = await proxyFetch(thumb, 'blob');
      const data = await compressImage(await fileToDataURL(blob), 1024);
      parts.push({ inlineData: { mimeType: 'image/jpeg', data: data.split(',')[1] } });
      parts.push({ text: '(Sopra: anteprima del video/post, utile per riconoscere il piatto.)' });
      thumb = data;
    } catch {}
  }
  if (caption && caption.length > 60) {
    try { res = await AI.generate({ system: RECIPE_RULES, parts }); } catch (e) { s2.ko(e.message); throw e; }
  }
  if (!res || !res.data || res.data.notARecipe) {
    try { res = await AI.generateWithFallback({ system: RECIPE_RULES, tools: ['url_context'], parts: [{ text: 'Leggi questo post e ricava la ricetta: ' + pf.url + '\nDidascalia nota: ' + (caption || 'nessuna') }] }); } catch { res = null; }
  }
  if (!res || !res.data || res.data.notARecipe) {
    s2.ko('Il post non contiene la ricetta scritta');
    throw Object.assign(new Error('Da fuori ' + name + ' mostra solo il video, non la ricetta. Soluzione rapida: apri il post, copia la didascalia (o fai uno screenshot dei passaggi) e usa "Testo" o "Foto".'), { code: 'social' });
  }
  s2.ok();
  const r = fromAiRecipe(res.data, { source: { type: pf.type, url: pf.url, author } });
  if (caption) reconcileDoses(r, caption);
  r.photo = thumb || '';
  if (!caption) r.warnings.push('Ricetta ricavata senza leggere la didascalia completa: verifica dosi e passaggi.');
  return r;
}

async function importFromText(text, log) {
  const s = log('L\'AI legge il testo');
  const res = await AI.generate({ system: RECIPE_RULES, parts: [{ text: 'Testo della ricetta:\n' + text }] });
  if (!res.data || res.data.notARecipe) { s.ko(); throw new Error('In questo testo non ho trovato una ricetta.'); }
  s.ok();
  const urlm = text.match(/https?:\/\/\S+/);
  const r = fromAiRecipe(res.data, { source: { type: 'text', url: urlm ? urlm[0] : '' } });
  reconcileDoses(r, text);
  return r;
}

function openModal(title, html, onMount) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="hd"><h2>${esc(title)}</h2><button class="iconbtn" data-act="modal-close" aria-label="Chiudi">${ic('x')}</button></div><div class="mb">${html}</div></div>`;

  document.body.appendChild(m);
  if (onMount) onMount(m);

}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function confirmBox(msg, okLabel = 'Conferma', danger = false) {
  return new Promise((res) => {
    const m = openModal('Sei sicuro?', `<p>${esc(msg)}</p><div class="row" style="margin-top:14px"><button class="btn grow" id="cbNo">Annulla</button><button class="btn grow ${danger ? 'danger' : 'primary'}" id="cbYes">${esc(okLabel)}</button></div>`);

}

function setNav(name) { $$('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.nav === name)); }

async function router() {
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  const app = $('#app');
  if (S.cook && parts[0] !== 'cucina') exitCook(true);
  window.scrollTo(0, 0);
  setMastAction('');
  try {
    if (!parts.length) { setNav('home'); return renderHome(app); }
    switch (parts[0]) {
      case 'r': setNav('home'); return renderRecipe(app, decodeURIComponent(parts[1]));

      case 'nuova': setNav('nuova'); return renderEditor(app, null);

  if (r.nutrition && r.nutrition.data && r.nutrition.data.perPortion) { const pp = r.nutrition.data.perPortion; L.push('', 'VALORI A PORZIONE (stima): ' + Math.round(pp.kcal || 0) + ' kcal · carboidrati ' + n1(pp.carbs) + ' g · proteine ' + n1(pp.protein) + ' g · grassi ' + n1(pp.fat) + ' g'); }

  if (r.source.url) L.push('', 'Fonte: ' + r.source.url);

}

function setPath(o, path, val) {
  const ks = path.split('.'); let x = o;
  for (let i = 0; i < ks.length - 1; i++) x = x[ks[i]];

}
function edAddEq() {

async function edSave() {
  const r = S.ed;
  if (!r.title.trim()) { toast('Dai un titolo alla ricetta'); $('[data-p="title"]').focus(); return; }
  // pulizia righe vuote
  r.components.forEach((c) => (c.ingredients = c.ingredients.filter((i) => i.name.trim())));
  r.components = r.components.filter((c, i) => c.ingredients.length || i === 0);
  r.phases.forEach((p) => (p.steps = p.steps.filter((s) => s.text.trim())));
  r.phases = r.phases.filter((p, i) => p.steps.length || i === 0);
  r.critical = r.critical.filter((c) => c.problem.trim());
  const ids = new Set(allIngredients(r).map((i) => i.id));
  r.phases.forEach((p) => p.steps.forEach((s) => (s.uses = s.uses.filter((u) => ids.has(u.ing)))));
  delete r._new;
  r.warnings = [];
  r.updatedAt = Date.now();
  const clean = normalizeRecipe(r);
  try { await DB.put(clean); }
  catch (e) { toast('Salvataggio non riuscito: memoria piena? ' + e.message, 5000); return; }
  await loadRecipes();
  if (S.draft && S.draft.id === clean.id) S.draft = null;
  S.ed = null; S.edDirty = false;
  delete S.view[clean.id];
  toast('Ricetta salvata ✓');
  if (AI.has() && settings.get('auto_nutri', true) && !nutriFresh(clean)) setTimeout(() => ensureNutrition(clean.id), 300);
  location.hash = '#/r/' + encodeURIComponent(clean.id);
}

function makeLogger() {
  const ul = $('#impLog'); ul.innerHTML = ''; $('#impErr').innerHTML = '';
  return (label) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="ic run">${ic('refresh', 'spin')}</span><span class="tx">${esc(label)}</span>`;
    ul.appendChild(li);
    const set = (cls, icon, extra) => { li.querySelector('.ic').className = 'ic ' + cls; li.querySelector('.ic').innerHTML = ic(icon); if (extra) li.querySelector('.tx').innerHTML = esc(label) + ' <span class="dim">— ' + esc(extra) + '</span>'; };
    return { ok: (x) => set('ok', 'check', x), ko: (x) => set('ko', 'x', x) };
  };
}
async function runImport(kind) {
  const btn = $('#impBox .btn.primary'); if (btn) btn.disabled = true;
  const log = makeLogger();
  try {
    let r;
    if (kind === 'link') {
      const url = ($('#impUrl').value || '').trim().match(/https?:\/\/\S+/)?.[0];
      if (!url) { toast('Incolla un link valido'); return; }
      S.importUrl = url;
      r = S.importPick ? await importWeb(url, log, S.importPick) : await importFromUrl(url, log);
      S.importPick = null;
    } else if (kind === 'text') {
      const text = $('#impText').value.trim();
      if (text.length < 30) { toast('Incolla il testo della ricetta'); return; }
      r = await importFromText(text, log);
    } else {
      const files = [...$('#impFiles').files].slice(0, 6);
      if (!files.length) { toast('Scegli almeno una foto'); return; }
      r = await importFromPhotos(files, $('#impCover').checked, log);
    }
    S.draft = r; S.ed = null; S.importUrl = '';
    location.hash = '#/modifica/' + encodeURIComponent(r.id);
  } catch (e) {
    console.error(e);
    $('#impErr').innerHTML = `<div class="notice" style="margin-top:8px"><b>Non ci sono riuscito.</b> ${esc(e.message)}
      ${e.code === 'nokey' ? `<div style="margin-top:8px"><a class="btn sm primary" href="#/impostazioni">Inserisci la chiave AI</a></div>` : ''}
      ${e.code === 'multi' ? `<div class="stack" style="margin-top:10px">${e.titles.map((t) => `<button class="btn block" style="justify-content:flex-start;text-align:left" data-act="imp-pick" data-t="${esc(t)}">${ic('chef')} ${esc(t)}</button>`).join('')}</div>` : ''}

  } finally { if (btn) btn.disabled = false; }
}

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (S.cook && document.visibilityState === 'visible') keepAwake(); });
function startCook(id) {
  const r = S.recipes.find((x) => x.id === id) || (S.draft && S.draft.id === id ? S.draft : null);
  if (!r) { location.hash = '#/'; return; }
  const v = S.view[id] || (S.view[id] = newView(r));
  const flat = [];
  r.phases.forEach((p) => p.steps.forEach((s) => flat.push({ phase: p.name, s })));
  S.cook = { r, v, flat, i: 0, rating: 0 };

}
function exitCook(silent) {

}

function bindSwipe(el) {
  let x0 = null, y0 = null;

    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && !e.target.closest('textarea,input')) cookMove(dx < 0 ? 1 : -1);
  });
}
function cookMove(d) {
  const c = S.cook; if (!c) return;
  if (d > 0 && c.i >= 1 && c.i <= c.flat.length) c.v.steps[c.flat[c.i - 1].s.id] = true;
  c.i = Math.max(0, Math.min(c.flat.length + 1, c.i + d));
  drawCook();
}
function openHelp() {
  const c = S.cook; const step = c.i >= 1 && c.i <= c.flat.length ? c.flat[c.i - 1].s : null;
