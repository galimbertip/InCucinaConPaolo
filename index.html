    <p class="small dim" style="margin:0">Per installarla: da Chrome (Android) menu ⋮ → <b>Aggiungi a schermata Home</b>; da Safari (iPhone) ${ic('share').replace('<svg', '<svg style="width:14px;height:14px;vertical-align:-2px"')} → <b>Aggiungi alla schermata Home</b>.</p>
  </div>

  <div class="card version-list" style="margin-top:16px">
    <h2>Versione ${APP_VERSION}</h2>
    ${CHANGELOG.map((c) => `<h4>v${c.v} <span class="dim small">— ${c.d}</span></h4><ul>${c.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
    <p class="small dim" style="margin-top:12px">In Cucina con Paolo · un progetto GPverse</p>
  </div>`;
  $('#bkIn').addEventListener('change', importBackup);
  $('#kcalIn').addEventListener('change', (e) => { const pr = dietProfile(); const v = Math.round(+e.target.value); if (v >= 1000 && v <= 5000) { pr.kcal = v; settings.set('diet_profile', pr); toast('Fabbisogno: ' + v + ' kcal'); } else e.target.value = pr.kcal; });
  $('#autoNutri').addEventListener('change', (e) => settings.set('auto_nutri', e.target.checked));
  $('#defPpl').addEventListener('change', (e) => { settings.set('default_people', +e.target.value); S.view = {}; toast(+e.target.value ? 'Le ricette si apriranno per ' + e.target.value : 'Dosi come scritte nella ricetta'); });
  $('#modelSel').addEventListener('change', (e) => { settings.set('gemini_model', e.target.value); toast('Modello: ' + e.target.value); });
  if (key) fillModels();
}
async function fillModels() {
  try {
    const list = await AI.models();
    const sel = $('#modelSel'); if (!sel) return;
    const cur = settings.get('gemini_model', 'auto');
    const best = AI.pickBest(list);
    sel.innerHTML = `<option value="auto">Automatico (${esc(best)})</option>` + list.filter((n) => /^gemini/.test(n)).map((n) => `<option value="${esc(n)}" ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('');
  } catch {}
}
async function testKey() {
  const out = $('#keyOut');
  out.innerHTML = '<span class="dim">Provo la chiave…</span>';
  try {
    const list = await AI.models(true);
    out.innerHTML = `<span style="color:var(--ok);font-weight:600">✓ Chiave funzionante.</span> Userò <b>${esc(AI.pickBest(list))}</b>.`;
    fillModels();
  } catch (e) { out.innerHTML = `<span style="color:var(--bad);font-weight:600">✗ ${esc(e.message)}</span>`; }
}
async function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const list = Array.isArray(j) ? j : j.recipes || (j.title ? [j] : []);
    if (!list.length) throw new Error('nessuna ricetta nel file');
    let n = 0;
    for (const r of list) { await DB.put(normalizeRecipe(r)); n++; }
    await loadRecipes();
    toast(n + (n === 1 ? ' ricetta importata' : ' ricette importate') + ' ✓');
    renderSettings($('#app'));
  } catch (err) { toast('File non valido: ' + err.message, 4000); }
}
function applyTheme() {
  const t = settings.get('theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}

/* =========================================================
   AZIONI (un solo gestore di click per tutta l'app)
   ========================================================= */
const ACT = {
  'go-back': () => { if (history.length > 1) history.back(); else location.hash = '#/'; },
  'modal-close': () => closeModal(),
  'timer': (a) => Timers.add(a.dataset.label || 'Timer', +a.dataset.min),
  'timer-stop': (a) => Timers.remove(a.dataset.id),
  // home
  'flt-fav': () => { S.filter.fav = !S.filter.fav; renderHome($('#app')); },
  'flt-cat': (a) => { S.filter.cat = a.dataset.v; renderHome($('#app')); },
  // vista ricetta
  'serv': (a) => { const v = S.view[a.dataset.id]; v.servings = Math.max(1, Math.min(200, Math.round(v.servings || 1) + +a.dataset.d)); rerenderRecipe(a.dataset.id); },
  'serv-reset': (a) => { const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; S.view[a.dataset.id].servings = r.servings.amount; rerenderRecipe(a.dataset.id); },
  'nutri': (a) => ensureNutrition(a.dataset.id, true),
  'go-nutri': () => { const el = $('#nutri-sec'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  'prof-flag': (a) => { const pr = dietProfile(); pr[a.dataset.k] = !pr[a.dataset.k]; settings.set('diet_profile', pr); a.classList.toggle('on'); },
  'prof-al': (a) => { const pr = dietProfile(); const v = a.dataset.v; pr.allergie = pr.allergie.includes(v) ? pr.allergie.filter((x) => x !== v) : pr.allergie.concat(v); settings.set('diet_profile', pr); a.classList.toggle('on'); },
  'ck-serv': (a) => { const v = S.cook.v; v.servings = Math.max(1, Math.min(200, Math.round(v.servings || 1) + +a.dataset.d)); drawCook(); },
  'chk-ing': (a) => { const v = S.view[a.dataset.id]; v.ings[a.dataset.i] = !v.ings[a.dataset.i]; rerenderRecipe(a.dataset.id); },
  'chk-eq': (a) => { const v = S.view[a.dataset.id]; v.eq[a.dataset.i] = !v.eq[a.dataset.i]; rerenderRecipe(a.dataset.id); },
  'chk-step': (a) => { const v = S.view[a.dataset.id]; v.steps[a.dataset.i] = !v.steps[a.dataset.i]; rerenderRecipe(a.dataset.id); },
  'fav': async (a) => { const r = S.recipes.find((x) => x.id === a.dataset.id); r.favorite = !r.favorite; await DB.put(r); rerenderRecipe(r.id); toast(r.favorite ? 'Aggiunta alle preferite' : 'Tolta dalle preferite'); },
  'rmenu': (a) => {
    const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; const saved = S.recipes.some((x) => x.id === r.id);
    openModal(r.title, `<div class="menu-list">
      <button class="btn" data-act="r-share" data-id="${r.id}">${ic('share')} Condividi come testo</button>
      <button class="btn" data-act="r-copy" data-id="${r.id}">${ic('copy')} Copia testo</button>
      <button class="btn" data-act="r-json" data-id="${r.id}">${ic('dl')} Esporta file ricetta</button>
      ${saved ? `<button class="btn" data-act="r-dup" data-id="${r.id}">${ic('plus')} Duplica</button>
      <button class="btn danger" data-act="r-del" data-id="${r.id}">${ic('trash')} Elimina</button>` : ''}</div>`);
  },
  'r-share': async (a) => {
    const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; const k = scaleOf(r, S.view[r.id] || {});
    const text = recipeToText(r, k);
    if (navigator.share) { try { await navigator.share({ title: r.title, text }); } catch {} }
    else { await navigator.clipboard.writeText(text).catch(() => {}); toast('Testo copiato'); }
    closeModal();
  },
  'r-copy': async (a) => { const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; try { await navigator.clipboard.writeText(recipeToText(r, scaleOf(r, S.view[r.id] || {}))); toast('Testo copiato ✓'); } catch { toast('Copia non riuscita'); } closeModal(); },
  'r-json': (a) => { const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; downloadFile(slug(r.title) + '.ricetta.json', JSON.stringify(r)); closeModal(); },
  'r-dup': async (a) => { const r = clone(S.recipes.find((x) => x.id === a.dataset.id)); r.id = uid(); r.title += ' (copia)'; r.createdAt = r.updatedAt = Date.now(); r.log = []; await DB.put(r); await loadRecipes(); closeModal(); location.hash = '#/modifica/' + r.id; },
  'r-del': async (a) => { closeModal(); if (!(await confirmBox('Eliminare questa ricetta? Non si può annullare.', 'Elimina', true))) return; await DB.del(a.dataset.id); await loadRecipes(); toast('Ricetta eliminata'); location.hash = '#/'; },
  // editor
  'ed-cancel': async () => {
    if (S.edDirty && !(await confirmBox('Uscire senza salvare le modifiche?', 'Esci senza salvare', true))) return;
    const id = S.ed && S.ed.id; const wasDraft = S.draft && S.draft.id === id;
    S.ed = null; S.edDirty = false;
    if (wasDraft) { const fromFrigo = S.draft.source.type === 'ai'; S.draft = null; location.hash = fromFrigo ? '#/frigo' : '#/importa'; }
    else if (id && S.recipes.some((x) => x.id === id)) location.hash = '#/r/' + encodeURIComponent(id);
    else location.hash = '#/';
  },
  'ed-save': () => edSave(),
  'ed-photo-del': () => { S.ed.photo = ''; S.edDirty = true; edRedraw(); },
  'ed-eq-add': () => edAddEq(),
  'ed-eq-del': (a) => { S.ed.equipment.splice(+a.dataset.i, 1); S.edDirty = true; edRedraw(); },
  'ed-grp-add': () => { S.ed.components.push({ id: uid(), name: '', ingredients: [newIng()] }); S.edDirty = true; edRedraw(); },
  'ed-grp-del': (a) => { S.ed.components.splice(+a.dataset.ci, 1); S.edDirty = true; edRedraw(); },
  'ed-ing-add': (a) => { const c = S.ed.components[+a.dataset.ci]; c.ingredients.push(newIng()); S.edDirty = true; edRedraw(`ing-${a.dataset.ci}-${c.ingredients.length - 1}`); },
  'ed-ing-del': (a) => { S.ed.components[+a.dataset.ci].ingredients.splice(+a.dataset.ii, 1); S.edDirty = true; edRedraw(); },
  'ed-ing-mv': (a) => {
    const ci = +a.dataset.ci, ii = +a.dataset.ii; const list = S.ed.components[ci].ingredients;
    if (ii > 0) { [list[ii - 1], list[ii]] = [list[ii], list[ii - 1]]; }
    else if (ci > 0) { const it = list.splice(0, 1)[0]; S.ed.components[ci - 1].ingredients.push(it); }
    S.edDirty = true; edRedraw();
  },
  'ed-ing-paste': (a) => {
    const ci = +a.dataset.ci;
    const m = openModal('Incolla elenco ingredienti', `<p class="small dim" style="margin-top:0">Un ingrediente per riga, ad esempio:<br><span class="kbd">200 g farina 00, setacciata</span><br><span class="kbd">Uova 2</span><br><span class="kbd">Sale q.b.</span></p><textarea id="pasteIng" rows="8"></textarea><button class="btn primary block" style="margin-top:10px" id="pasteGo">Aggiungi</button>`);
    $('#pasteGo', m).onclick = () => {
      const lines = $('#pasteIng', m).value.split('\n').map(parseIngredientLine).filter(Boolean);
      const c = S.ed.components[ci]; c.ingredients = c.ingredients.filter((i) => i.name.trim()).concat(lines);
      S.edDirty = true; closeModal(); edRedraw(); toast(lines.length + ' ingredienti aggiunti');
    };
  },
  'ed-ph-add': () => { S.ed.phases.push({ id: uid(), name: '', steps: [newStep()] }); S.edDirty = true; edRedraw(); },
  'ed-ph-del': (a) => { S.ed.phases.splice(+a.dataset.pi, 1); S.edDirty = true; edRedraw(); },
  'ed-st-add': (a) => { const p = S.ed.phases[+a.dataset.pi]; p.steps.push(newStep()); S.edDirty = true; edRedraw(`st-${a.dataset.pi}-${p.steps.length - 1}`); },
  'ed-st-del': (a) => { S.ed.phases[+a.dataset.pi].steps.splice(+a.dataset.si, 1); S.edDirty = true; edRedraw(); },
  'ed-st-mv': (a) => {
    const pi = +a.dataset.pi, si = +a.dataset.si, d = +a.dataset.d; const ph = S.ed.phases;
    const list = ph[pi].steps; const j = si + d;
    if (j >= 0 && j < list.length) [list[si], list[j]] = [list[j], list[si]];
    else if (j < 0 && pi > 0) ph[pi - 1].steps.push(list.splice(si, 1)[0]);
    else if (j >= list.length && pi < ph.length - 1) ph[pi + 1].steps.unshift(list.splice(si, 1)[0]);
    S.edDirty = true; edRedraw();
  },
  'ed-st-photo-del': (a) => { S.ed.phases[+a.dataset.pi].steps[+a.dataset.si].photo = ''; S.edDirty = true; edRedraw(); },
  'ed-use': (a) => {
    const s = S.ed.phases[+a.dataset.pi].steps[+a.dataset.si]; const id = a.dataset.ing;
    const i = s.uses.findIndex((u) => u.ing === id);
    if (i > -1) s.uses.splice(i, 1); else s.uses.push({ ing: id, qty: null });
    a.classList.toggle('on'); S.edDirty = true;
  },
  'ed-cr-add': () => { S.ed.critical.push({ problem: '', fix: '' }); S.edDirty = true; edRedraw(); },
  'ed-cr-del': (a) => { S.ed.critical.splice(+a.dataset.i, 1); S.edDirty = true; edRedraw(); },
  // import
  'imp-tab': (a) => { S.importTab = a.dataset.t; renderImport($('#app')); },
  'imp-paste': async () => { try { const t = await navigator.clipboard.readText(); $('#impUrl').value = (t.match(/https?:\/\/\S+/) || [t])[0]; } catch { toast('Tieni premuto nel campo e scegli Incolla'); } },
  'imp-go': () => { S.importPick = null; runImport('link'); },
  'imp-pick': (a) => { S.importPick = a.dataset.t; runImport('link'); },
  'imp-text': () => runImport('text'),
  'imp-photo': () => runImport('photo'),
  // frigo
  'fr-add': () => frAdd(),
  'fr-sug': (a) => { const f = frigoState(); f.items.push(a.dataset.v); saveFrigo(); frRedraw(); },
  'fr-del': (a) => { frigoState().items.splice(+a.dataset.i, 1); saveFrigo(); frRedraw(); },
  'fr-clear': () => { frigoState().items = []; saveFrigo(); frRedraw(); },
  'fr-tool': (a) => { const f = frigoState(); const v = a.dataset.v; f.tools = f.tools.includes(v) ? f.tools.filter((x) => x !== v) : f.tools.concat(v); saveFrigo(); a.classList.toggle('on'); },
  'fr-time': (a) => { frigoState().time = +a.dataset.v; saveFrigo(); $$('[data-act="fr-time"]').forEach((b) => b.classList.toggle('on', b === a)); },
  'fr-ppl': (a) => { const f = frigoState(); f.people = Math.max(1, Math.min(20, f.people + +a.dataset.d)); saveFrigo(); a.parentElement.querySelector('.v').textContent = f.people; },
  'fr-kind': (a) => { frigoState().kind = a.dataset.v; $$('[data-act="fr-kind"]').forEach((b) => b.classList.toggle('on', b === a)); },
  'fr-pantry-edit': (a, e) => {
    e.preventDefault(); const f = frigoState();
    const m = openModal('Dispensa base', `<p class="small dim" style="margin-top:0">Le cose che hai sempre in casa, separate da virgola.</p><textarea id="pantryIn" rows="4">${esc(f.pantry.join(', '))}</textarea><button class="btn primary block" style="margin-top:10px" id="pantryGo">Salva</button>`);
    $('#pantryGo', m).onclick = () => { f.pantry = $('#pantryIn', m).value.split(',').map((s) => s.trim()).filter(Boolean); saveFrigo(); closeModal(); frRedraw(); };
  },
  'fr-go': () => frSearch(false),
  'fr-more': () => frSearch(true),
  'fr-make': async (a) => {
    const idea = S.frigoIdeas[+a.dataset.i]; a.disabled = true; a.innerHTML = ic('refresh', 'spin') + ' Scrivo la ricetta…';
    try { const r = await fridgeRecipe(idea, frigoState()); S.draft = r; S.ed = null; location.hash = '#/r/' + encodeURIComponent(r.id); }
    catch (e) { toast(e.message, 4000); a.disabled = false; a.innerHTML = ic('chef') + ' Fammi la ricetta'; }
  },
  'fr-import': (a) => { const idea = S.frigoIdeas[+a.dataset.i]; S.importTab = 'link'; S.importUrl = idea.sourceUrl; S.autoImport = true; location.hash = '#/importa'; },
  // cucina
  'ck-close': () => exitCook(),
  'ck-next': () => cookMove(1),
  'ck-prev': () => cookMove(-1),
  'ck-ing': (a) => { const v = S.cook.v; v.ings[a.dataset.i] = !v.ings[a.dataset.i]; drawCook(); },
  'ck-eq': (a) => { const v = S.cook.v; v.eq[a.dataset.i] = !v.eq[a.dataset.i]; drawCook(); },
  'ck-rate': (a) => { S.cook.rating = +a.dataset.v; $$('.rate button').forEach((b, i) => b.classList.toggle('on', i < S.cook.rating)); },
  'ck-help': () => openHelp(),
  'ck-finish': async () => {
    const c = S.cook; const note = ($('#ckNote') || {}).value || '';
    const saved = S.recipes.find((x) => x.id === c.r.id);
    if (saved) { saved.log.push({ date: Date.now(), rating: c.rating, note: note.trim() }); await DB.put(saved); toast('Salvato nel diario ✓'); }
    S.view[c.r.id] = Object.assign(newView(c.r), { servings: c.v.servings });
    exitCook();
  },
  // impostazioni
  'key-show': () => { const i = $('#keyIn'); i.type = i.type === 'password' ? 'text' : 'password'; },
  'key-save': () => { const v = $('#keyIn').value.trim(); settings.set('gemini_key', v); settings.set('gemini_models', null); if (v) testKey(); else toast('Chiave rimossa'); },
  'key-del': () => { settings.set('gemini_key', ''); settings.set('gemini_models', null); renderSettings($('#app')); toast('Chiave rimossa'); },
  'bk-export': () => { downloadFile('incucina-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app: 'incucina', version: APP_VERSION, date: Date.now(), recipes: S.recipes })); },
  'bk-wipe': async () => { if (!(await confirmBox('Cancellare TUTTE le ricette da questo dispositivo? Fai prima un backup.', 'Cancella tutto', true))) return; await DB.clear(); await loadRecipes(); renderSettings($('#app')); toast('Ricette cancellate'); },
  'theme': (a) => { settings.set('theme', a.dataset.v); applyTheme(); renderSettings($('#app')); }
};
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (fn) { if (a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault(); fn(a, e); }
});
// campo persone: ricalcolo appena smetti di scrivere (o con Invio)
let servTimer = null, servRefocus = false;
function applyServ(el) {
  const n = Math.round(num(el.value)); const id = el.dataset.serv; const inCook = !!el.closest('#cook');
  const v = inCook ? (S.cook && S.cook.v) : S.view[id]; if (!v) return;
  if (!n || n < 1 || n > 200) { el.value = v.servings; return; }
  if (v.servings === n) return;
  const hadFocus = document.activeElement === el;
  v.servings = n;
  if (inCook) drawCook(); else rerenderRecipe(id);
  const again = $((inCook ? '#cook ' : '#app ') + 'input[data-serv]');
  if (again && hadFocus) { servRefocus = true; again.focus(); servRefocus = false; try { const L = again.value.length; again.setSelectionRange(L, L); } catch {} }
}
document.addEventListener('input', (e) => {
  const el = e.target; if (el.dataset.serv === undefined) return;
  clearTimeout(servTimer); servTimer = setTimeout(() => applyServ(el), 600);
});
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset.serv === undefined) return; clearTimeout(servTimer); applyServ(el); });
document.addEventListener('keydown', (e) => { const el = e.target; if (e.key === 'Enter' && el.dataset && el.dataset.serv !== undefined) { clearTimeout(servTimer); applyServ(el); el.blur(); } });
document.addEventListener('focusin', (e) => { if (!servRefocus && e.target.dataset && e.target.dataset.serv !== undefined) e.target.select(); });
// input nell'editor: scrive direttamente nella ricetta in modifica
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!S.ed || !el.closest('#app')) return;
  if (el.dataset.p) {
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num !== undefined) v = num(v);
    setPath(S.ed, el.dataset.p, v); S.edDirty = true;
    if (/^times\./.test(el.dataset.p)) { const tot = $$('.ed-grid4 input[disabled]')[0]; if (tot) tot.value = fmtMin(totalMin(S.ed)) || '—'; }
  } else if (el.dataset.tags !== undefined) {
    S.ed.tags = el.value.split(',').map((s) => s.trim()).filter(Boolean); S.edDirty = true;
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.p && el.type === 'checkbox' && S.ed) { setPath(S.ed, el.dataset.p, el.checked); S.edDirty = true; return; }
  if (!el.dataset.photo || !S.ed || !el.files[0]) return;
  try {
    const d = await fileToPhoto(el.files[0]);
    if (el.dataset.photo === 'cover') S.ed.photo = d;
    else S.ed.phases[+el.dataset.pi].steps[+el.dataset.si].photo = d;
    S.edDirty = true; edRedraw();
  } catch (err) { toast('Foto non leggibile'); }
});
document.addEventListener('keydown', (e) => {
  if (!S.cook || e.target.closest('textarea,input')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); cookMove(1); }
  if (e.key === 'ArrowLeft') cookMove(-1);
  if (e.key === 'Escape') exitCook();
});
window.addEventListener('beforeunload', (e) => { if (S.edDirty) { e.preventDefault(); e.returnValue = ''; } });

/* =========================================================
   AVVIO
   ========================================================= */
(async function init() {
  applyTheme();
  try { await loadRecipes(); } catch (e) { $('#app').innerHTML = `<div class="empty">Il browser non permette di salvare dati (modalità privata?). ${esc(e.message)}</div>`; }
  // link condiviso da altre app (Condividi → In Cucina)
  const qs = new URLSearchParams(location.search);
  const shared = [qs.get('url'), qs.get('text'), qs.get('title')].filter(Boolean).join(' ');
  const link = shared.match(/https?:\/\/\S+/);
  if (link) {
    history.replaceState(null, '', location.pathname + '#/importa');
    S.importTab = 'link'; S.importUrl = link[0]; S.autoImport = true;
    await router();
  } else await router();
  window.addEventListener('hashchange', router);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
