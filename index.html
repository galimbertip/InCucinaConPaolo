<!DOCTYPE html>
<!--
  In Cucina con Paolo — GPverse
  Cronologia versioni (schema V.major.minor.patch)

  v1.8.0 — 28 ottobre 2026
    - Import social/video rivisto: descrizione YouTube + video, timeout
      lungo senza ripetizioni, Instagram via embed/captioned, TikTok con
      link brevi e dati pagina, nuova scheda Video (Files API + foto dei
      passaggi dai fotogrammi), niente ricette inventate.

  v1.7.0 — 23 ottobre 2026
    - Lista della spesa: ricette scelte + persone per ciascuna, quantità
      sommate e convertite (g/kg, ml/l), raggruppate per reparto, spunte,
      voci libere, condivisione. Carrello in testata, schede e ricetta.

  v1.6.1 — 22 ottobre 2026
    - Fix "Google sovraccarico" in Svuota frigo / Cosa cucino?: ripiego
      senza ricerca web, cambio automatico di modello, lettura idee più
      tollerante, test chiave reale e registro richieste AI.

  v1.6.0 — 22 ottobre 2026
    - "Cosa cucino?": domande guidate → proposte → + per salvarle nel
      ricettario (con esigenze degli ospiti).
    - Modifica/Elimina direttamente dalle schede del ricettario.

  v1.5.0 — 22 ottobre 2026
    - "Cerca aggiornamenti" in Impostazioni e Versioni (legge version.json),
      installazione con un tocco, controllo automatico ogni 6 ore.
    - Service worker: rivalida sempre la pagina col server.

  v1.4.0 — 22 ottobre 2026
    - Esigenze a tavola impostate per singola ricetta (ospiti diversi a
      ogni occasione), con avvisi e consigli "Per i tuoi ospiti".
    - Tolto il profilo alimentare generale dalle Impostazioni.

  v1.3.0 — 22 ottobre 2026
    - Versioni visibili in app (schema V.MAJOR.MINOR.PATCH): numero in
      testata, cronologia con tipo di aggiornamento, finestra "Novità"
      automatica dopo ogni aggiornamento.

  v1.2.0 — 22 ottobre 2026
    - Controllo automatico delle dosi sul testo originale dopo la
      conversione AI (es. "1 cucchiaio di latte" non diventa più 2).
    - Import da link più robusto quando il sito blocca la lettura.
    - Nutrizionista: valori a porzione e per 100 g, % giornaliera, fonti
      delle calorie, porzioni per pasto/spuntino, sezione diabetici
      (carboidrati, indice e carico glicemico), 14 allergeni UE.
    - Profilo alimentare con avvisi personalizzati e alternative.

  v1.1.0 — 22 ottobre 2026
    - Ricette dinamiche: campo persone digitabile (oltre a − / +) con
      ricalcolo immediato di tutte le dosi, anche dentro i passaggi.
    - Persone predefinite in Impostazioni (ricette già calcolate all'apertura).
    - Scelta delle persone anche in modalità cucina (mise en place).
    - Avviso che tempi e teglie possono cambiare con dosi ricalcolate.

  v1.0.0 — 22 ottobre 2026
    - Prima versione.
    - Formato ricetta unico per tutte le ricette: scheda (tempi, porzioni
      scalabili, difficoltà), "Prima di iniziare" (attrezzatura + punti
      critici), ingredienti raggruppati per preparazione e in ordine d'uso
      con spunta per la mise en place, procedimento a fasi con dosi dentro
      ogni passaggio, tempo, temperatura e "è pronto quando…".
    - Crea/modifica ricette con testo e foto (copertina e foto dei passaggi).
    - Importa da link: siti di ricette (lettura dei dati strutturati della
      pagina), YouTube (analisi del video con l'AI, con salto al punto
      giusto del video per ogni passaggio), TikTok, Instagram, Facebook;
      in alternativa da testo incollato o da foto/screenshot.
    - Svuota frigo: ingredienti, strumenti, tempo e persone → idee, con
      "Altre idee" per rifare la ricerca e "Fammi la ricetta".
    - Modalità cucina: un passaggio per schermata, schermo sempre acceso,
      timer, pulsante "Aiuto!" quando qualcosa va storto.
    - App installabile (icona, funziona offline), backup ed esportazione.
-->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In Cucina con Paolo — GPverse</title>
<meta name="description" content="Il ricettario di Paolo: crea, importa da link e video, svuota frigo.">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="In Cucina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4fa; --panel:#ffffff; --panel-2:#e6f0f8; --text:#0f1b2d; --dim:#56697f;
  --line:rgba(15,27,45,.12); --accent:#0a7f93; --accent-2:#2952e3; --violet:#6b4fe0;
  --ok:#1a8a5a; --warn:#b26a00; --warn-bg:#fff4e0; --bad:#c23b4a;
  --on-accent:#ffffff; --shadow:0 6px 24px rgba(15,27,45,.08);
  --mast-1:#05070f; --mast-2:#0d1326;
  --r:16px; --nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070a13; --panel:#111829; --panel-2:#18213a; --text:#eaf3fb; --dim:#93a8c6;
    --line:rgba(234,243,251,.11); --accent:#3fe0f0; --accent-2:#5b8cff; --violet:#a58bff;
    --ok:#4fd39a; --warn:#ffbe5c; --warn-bg:rgba(255,190,92,.1); --bad:#ff7383;
    --on-accent:#04121a; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#070a13; --panel:#111829; --panel-2:#18213a; --text:#eaf3fb; --dim:#93a8c6;
  --line:rgba(234,243,251,.11); --accent:#3fe0f0; --accent-2:#5b8cff; --violet:#a58bff;
  --ok:#4fd39a; --warn:#ffbe5c; --warn-bg:rgba(255,190,92,.1); --bad:#ff7383;
  --on-accent:#04121a; --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
h1,h2,h3,h4,.brand,.btn,.chip,.nav a,.meta-pill,.stepnum{font-family:"Space Grotesk",system-ui,sans-serif}
h1{font-size:1.75rem;line-height:1.15;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0 0 .6em;letter-spacing:-.005em}
h3{font-size:1.02rem;margin:0 0 .4em}
a{color:var(--accent)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.dim{color:var(--dim)}
.small{font-size:.88rem}

/* Masthead */
.mast{background:radial-gradient(120% 140% at 50% 0%,var(--mast-2),var(--mast-1));color:#eaf3fb;padding:calc(var(--safe-t) + 10px) 0 12px;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(63,224,240,.18)}
.mast .wrap{display:flex;align-items:center;gap:12px}
.mast img{width:46px;height:36px;object-fit:cover;border-radius:8px}
.brand{font-weight:700;font-size:1.08rem;line-height:1.1}
.brand small{display:block;font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#3fe0f0;opacity:.85}
.mast-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.cartbtn{position:relative;color:#eaf3fb;border-color:rgba(234,243,251,.2)}
.badge-n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;padding:0 5px;background:#3fe0f0;color:#04121a;font:700 .7rem/19px "Space Grotesk",system-ui,sans-serif;text-align:center}
.badge-n:empty{display:none}
.verbtn{font:inherit;letter-spacing:.06em;color:#3fe0f0;background:rgba(63,224,240,.12);border:1px solid rgba(63,224,240,.35);border-radius:6px;padding:0 6px;margin-left:2px;cursor:pointer;text-transform:none}
.verbtn.new{background:#3fe0f0;color:#04121a;font-weight:700}
.ver{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-top:14px}
.ver:first-of-type{margin-top:4px}
.ver h4{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Space Grotesk",system-ui,sans-serif}
.ver ul{margin:6px 0 0;padding-left:18px;font-size:.92rem}
.ver.t-MAJOR{border-color:var(--bad)} .ver.t-MINOR{border-color:var(--accent)} .ver.t-PATCH{border-color:var(--ok)}
.vtag{font-size:.68rem;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:1px 7px;font-family:"Space Grotesk",system-ui,sans-serif}
.vtag.MAJOR{background:color-mix(in srgb,var(--bad) 18%,var(--panel));color:var(--bad)}
.vtag.MINOR{background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent)}
.vtag.PATCH{background:color-mix(in srgb,var(--ok) 18%,var(--panel));color:var(--ok)}
.vtag.CUR{background:var(--text);color:var(--bg)}
.vscheme{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.88rem;align-items:center;margin:4px 0 6px}
.vnum{font-family:"Space Grotesk",system-ui,sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:.02em;text-align:center;margin:4px 0}
.vnum span{padding:0 2px} .vnum .a{color:var(--bad)} .vnum .b{color:var(--accent)} .vnum .c{color:var(--ok)}
.upd-new{border:1px solid var(--accent);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.upd-new ul{margin:6px 0 10px;padding-left:18px;font-size:.9rem}
.homever{text-align:center;margin:26px 0 0;font-size:.82rem}
.homever button{background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;text-decoration:underline}
.mast .iconbtn{color:#eaf3fb;border-color:rgba(234,243,251,.2)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center;padding:0 6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:500;color:var(--dim);text-decoration:none;padding:6px 0}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--accent)}
.nav a.fab{justify-self:center}
.nav a.fab span.b{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--on-accent);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-18px}
.nav a.fab svg{width:26px;height:26px}

/* Generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:12px;padding:11px 16px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;min-height:46px;transition:transform .08s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--text);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.sm svg{width:16px;height:16px}
.iconbtn.on{color:#f5b800}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--dim);margin:0 0 4px}
input[type=text],input[type=url],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:80px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500;cursor:pointer;user-select:none;line-height:1.2}
.chip.on{background:color-mix(in srgb,var(--accent) 22%,var(--panel));border-color:var(--accent);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.chip .x{opacity:.6;font-weight:700}
.chip svg{width:14px;height:14px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-family:"Space Grotesk",system-ui,sans-serif;font-size:.88rem;cursor:pointer;color:var(--dim)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:.92rem}
.notice b{color:var(--warn)}
.info{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--accent) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:.92rem}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.sectionhead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sectionhead h2{margin:0}
.sectionhead .num{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:.9rem;background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--on-accent)}
.sectionhead .aside{margin-left:auto}

/* Home */
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
@media (min-width:640px){.quick{grid-template-columns:repeat(4,1fr)}}
.quick a.hl{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),color-mix(in srgb,var(--violet) 14%,var(--panel)));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.quick a{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.quick a svg{width:26px;height:26px;color:var(--accent)}
.quick a b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:.95rem;line-height:1.15}
.quick a span{font-size:.78rem;color:var(--dim);line-height:1.25}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--dim)}
.search input{padding-left:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.rcard .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--mast-2),#1b2a52);position:relative}
.rcard .ph img{width:100%;height:100%;object-fit:cover}
.rcard .ph .fav{position:absolute;top:8px;right:8px;color:#f5b800;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.rcard .ph .fav svg{width:20px;height:20px}
.rcard .ph .fav{top:auto;bottom:8px;right:8px}
.rcard .cact{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.rcard .cact button{width:34px;height:34px;border-radius:10px;border:0;display:grid;place-items:center;background:rgba(5,7,15,.62);color:#fff;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rcard .cact button svg{width:16px;height:16px}
.rcard .cact button.del{color:#ff9aa5}
.rcard .cact button.cart.on{background:#3fe0f0;color:#04121a}
.rcard.inlist{outline:2px solid var(--accent);outline-offset:-1px}
.shopbar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:20;margin-top:16px;display:flex;gap:10px;align-items:center;padding:10px 10px 10px 14px;background:var(--mast-1);color:#eaf3fb;border:1px solid rgba(63,224,240,.35);border-radius:16px;box-shadow:var(--shadow)}
.shopbar svg{width:22px;height:22px;color:#3fe0f0;flex:none}
.shopbar span{flex:1;font-size:.92rem}
.rcard .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#3fe0f0;opacity:.6}
.rcard .ph .noimg svg{width:44px;height:44px}
.rcard .bd{padding:10px 12px 12px}
.rcard h3{font-size:.98rem;line-height:1.2;margin:0 0 6px}
.rcard .m{font-size:.78rem;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}

/* Recipe view */
.hero{margin:0 -16px;aspect-ratio:16/10;max-height:420px;background:linear-gradient(135deg,var(--mast-2),#1b2a52);position:relative;overflow:hidden}
@media (min-width:812px){.hero{margin:14px 0 0;border-radius:var(--r)}}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#3fe0f0;opacity:.55}
.hero .noimg svg{width:80px;height:80px}
.metarow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.meta-pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:.84rem;font-weight:500}
.meta-pill svg{width:16px;height:16px;color:var(--accent)}
.meta-pill b{font-weight:700}
.servings{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.servings .v{min-width:92px;text-align:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600}
.servings .serv-in{width:64px;min-height:36px;padding:4px 6px;text-align:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1.05rem;-moz-appearance:textfield}
.servings .serv-in::-webkit-outer-spin-button,.servings .serv-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.servings .u{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;margin-right:4px}
.actions{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;margin:14px 0}
.iconbtn.incart{background:var(--accent);color:var(--on-accent);border-color:transparent}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.checklist li:last-child{border-bottom:0}
.checklist .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.checklist .box svg{width:15px;height:15px;opacity:0;color:var(--on-accent)}
.checklist li.done .box{background:var(--ok);border-color:var(--ok)}
.checklist li.done .box svg{opacity:1}
.checklist li.done .t{opacity:.5;text-decoration:line-through}
.qty{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;white-space:nowrap}
.est{color:var(--warn);font-weight:700;margin-right:1px}
.prep{color:var(--dim)}
.opt{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--dim)}
.group-name{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 2px}
.group-name:first-child{margin-top:0}
.phase{margin-top:18px}
.phase:first-child{margin-top:0}
.phase-title{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phase-title:before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--accent),var(--violet))}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.stepnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:.92rem;cursor:pointer}
.step.done .stepnum{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
.step.done .st{opacity:.55}
.step .st{margin:4px 0 0}
.step .uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.use{font-size:.83rem;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:8px;padding:3px 8px}
.step .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;font-family:"Space Grotesk",system-ui,sans-serif;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:default;text-decoration:none;color:var(--text)}
.badge svg{width:14px;height:14px}
button.badge{cursor:pointer}
.badge.timer{color:var(--accent)}
.badge.video{color:var(--bad)}
.cue{margin-top:8px;padding:8px 11px;border-radius:10px;background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-left:3px solid var(--ok);font-size:.92rem}
.cue b{color:var(--ok)}
.step img.sp{margin-top:10px;border-radius:12px;max-height:280px;object-fit:cover;width:100%}
.critical{display:grid;gap:10px}
.crit{padding:12px 14px;border-radius:12px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.crit .p{font-weight:700;display:flex;gap:8px;align-items:flex-start}
.crit .p svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:2px}
.crit .fx{margin:4px 0 0 26px;font-size:.93rem}
.prose{white-space:pre-wrap}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.stars{display:inline-flex;gap:2px;color:#f5b800}
.stars svg{width:16px;height:16px}

/* Nutrizione */
.nutri-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutri-kpi div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.nutri-kpi b{display:block;font-family:"Space Grotesk",system-ui,sans-serif;font-size:1.15rem;color:var(--accent)}
.nutri-kpi span{font-size:.72rem;color:var(--dim)}
table.nutri{width:100%;border-collapse:collapse;font-size:.92rem}
table.nutri th{text-align:right;font-weight:600;color:var(--dim);font-size:.78rem;padding:6px 4px;border-bottom:2px solid var(--line)}
table.nutri td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.nutri td:first-child,table.nutri th:first-child{text-align:left}
table.nutri tr.sub td:first-child{padding-left:18px;color:var(--dim)}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:.86rem}
.bar-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--violet))}
.advice{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.advice .lbl{display:flex;gap:6px;align-items:flex-start;font-weight:700;font-family:"Space Grotesk",system-ui,sans-serif;font-size:.86rem}
.advice .lbl svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}
.diab{border-radius:12px;padding:12px;background:var(--panel-2);border:1px solid var(--line)}
.diab.me{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.gi-ok b{color:var(--ok)} .gi-mid b{color:var(--warn)} .gi-hi b{color:var(--bad)}
.chip.al-yes{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warn-bg)}
.chip.al-tr{border-style:dashed}
.chip.al-me{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel));font-weight:700}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.no{opacity:.7;text-decoration:line-through}
.prof-alert{margin-top:12px;border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);font-size:.93rem}
.prof-alert b{color:var(--bad)}
.needsbar{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.9rem;color:var(--text)}
.needsbar>svg{width:18px;height:18px;color:var(--accent);flex:none}
.needsbar>span:not(.ed){flex:1}
.needsbar .ed svg{width:16px;height:16px;color:var(--dim)}

/* Editor */
.ed-sec{margin-top:18px}
.ed-sec>h2{display:flex;align-items:center;gap:8px}
.ed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ed-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.ed-grid4{grid-template-columns:repeat(2,1fr)}}
.ing-row{display:grid;grid-template-columns:72px 76px 1fr auto;gap:6px;align-items:center;margin-top:8px}
.ing-row .prepin{grid-column:1/4}
.ing-row input{min-height:40px;padding:8px 9px}
.ing-tools{display:flex;gap:4px;grid-row:span 2;flex-direction:column}
.ed-ing{border-bottom:1px dashed var(--line);padding-bottom:8px}
.ed-group{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--bg)}
.ed-step{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:var(--panel)}
.ed-step .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ed-step .hd .stepnum{width:30px;height:30px;font-size:.85rem;cursor:default}
.photo-pick{position:relative;border:2px dashed var(--line);border-radius:14px;min-height:120px;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--dim);background:var(--bg)}
.photo-pick img{width:100%;max-height:260px;object-fit:cover}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-pick .lbl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;padding:12px;text-align:center}
.photo-pick .lbl svg{width:28px;height:28px}
.mini-photo{display:flex;gap:8px;align-items:center;margin-top:8px}
.mini-photo img{width:72px;height:54px;object-fit:cover;border-radius:8px}
.savebar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:20;display:flex;gap:10px;margin-top:20px;padding:10px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.savebar .btn{flex:1}

/* Import */
.steps-log{list-style:none;padding:0;margin:12px 0 0;font-size:.92rem}
.steps-log li{display:flex;gap:10px;padding:6px 0;align-items:flex-start}
.steps-log .ic{width:20px;height:20px;flex:none;display:grid;place-items:center;margin-top:1px}
.steps-log .ic svg{width:18px;height:18px}
.steps-log .ok{color:var(--ok)} .steps-log .ko{color:var(--bad)} .steps-log .run{color:var(--accent)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.platforms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

/* Fridge */
.idea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.idea h3{font-size:1.08rem;margin-bottom:4px}
.idea .why{font-size:.9rem;color:var(--dim);margin-top:6px}
.idea .miss{font-size:.88rem;margin-top:6px}
.idea .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chipinput{display:flex;gap:8px}
.shop-rec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.shop-rec:last-child{border-bottom:0}
.shop-rt{display:flex;align-items:center;gap:10px;flex:1 1 160px;min-width:0;color:var(--text);text-decoration:none}
.shop-rt img,.shop-rt .ph0{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--panel-2);display:grid;place-items:center;color:var(--accent)}
.shop-rt .ph0 svg{width:24px;height:24px}
.shop-rt b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:.95rem;line-height:1.2}
.servings.sm{padding:3px 5px;gap:4px;border-radius:12px}
.servings.sm .serv-in{width:46px;min-height:32px;font-size:.95rem}
.servings.sm .u{font-size:.8rem}
.servings.sm .v{min-width:28px;font-size:.95rem}
.shop-from{display:block;font-size:.76rem;color:var(--dim);margin-top:1px}
.pk-list{display:grid;gap:6px;max-height:52vh;overflow:auto}
.pk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.pk .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.pk .box svg{width:15px;height:15px;opacity:0;color:var(--on-accent)}
.pk.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.pk.on .box{background:var(--accent);border-color:var(--accent)}
.pk.on .box svg{opacity:1}
.pk-t{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column;line-height:1.25}
.wz-dots{display:flex;gap:8px;margin:6px 0 14px}
.wz-dots span{flex:1;height:30px;border-radius:9px;display:grid;place-items:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:.85rem;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.wz-dots span.on{background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--on-accent);border-color:transparent}
.wz-dots span.done{color:var(--accent);border-color:var(--accent)}
.wz-card h2{margin-bottom:4px}
.chips.big .chip{padding:10px 15px;font-size:.95rem}
.addbtn{width:46px;height:46px;border-radius:14px;border:0;flex:none;display:grid;place-items:center;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.addbtn svg{width:24px;height:24px}
.addbtn.ok{background:var(--ok);text-decoration:none}
.addbtn[disabled]{opacity:.7}
.chipinput input{flex:1}

/* Cooking mode */
.cook{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.cook .top{display:flex;align-items:center;gap:10px;padding:10px 16px}
.cook .top .t{flex:1;min-width:0}
.cook .top .t b{display:block;font-family:"Space Grotesk",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook .bar{height:4px;background:var(--line);margin:0 16px;border-radius:2px;overflow:hidden}
.cook .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));transition:width .25s}
.cook .body{flex:1;overflow:auto;padding:18px 16px 24px;max-width:780px;width:100%;margin:0 auto}
.cook .phase-l{font-family:"Space Grotesk",system-ui,sans-serif;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cook .big{font-size:1.45rem;line-height:1.4;margin:10px 0 14px;font-weight:600}
.cook .bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);max-width:780px;width:100%;margin:0 auto}
.cook .bottom .btn{min-height:58px;font-size:1.05rem}
.cook .help{position:absolute;right:16px;bottom:calc(96px + var(--safe-b));border-radius:999px;background:var(--bad);color:#fff;border:0;padding:12px 18px;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;box-shadow:0 6px 20px rgba(194,59,74,.4);cursor:pointer;display:flex;gap:6px;align-items:center}
.cook .help svg{width:18px;height:18px}
.rate{display:flex;gap:8px;justify-content:center;margin:16px 0}
.rate button{background:none;border:0;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:#f5b800}
.rate svg{width:40px;height:40px}

/* Timers bar */
.timers{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:120;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
body.cooking .timers{bottom:auto;top:calc(var(--safe-t) + 74px)}
.tmr{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--mast-1);color:#eaf3fb;border:1px solid rgba(63,224,240,.35);border-radius:999px;padding:7px 8px 7px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:"Space Grotesk",system-ui,sans-serif;max-width:92vw}
.tmr .lb{font-size:.8rem;opacity:.75;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr .tm{font-weight:700;font-size:1.05rem;color:#3fe0f0;font-variant-numeric:tabular-nums}
.tmr.ring{background:#c23b4a;border-color:#ff9aa5;animation:pulse 1s infinite}
.tmr.ring .tm{color:#fff}
.tmr button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
.tmr button svg{width:15px;height:15px}
@keyframes pulse{50%{transform:scale(1.04)}}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:200;background:rgba(3,6,14,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:640px){.modal{align-items:center;padding:20px}}
.modal .sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media (min-width:640px){.modal .sheet{border-radius:20px}}
.modal .sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .sheet .hd h2{margin:0;flex:1}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start}
.toast{width:max-content;position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translateX(-50%);z-index:300;background:var(--mast-1);color:#eaf3fb;padding:10px 16px;border-radius:12px;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:92vw;border:1px solid rgba(63,224,240,.3)}
.ai-answer ul{padding-left:20px;margin:6px 0}
.ai-answer p{margin:6px 0}
.version-list{font-size:.9rem}
.version-list h4{margin:10px 0 2px;font-family:"Space Grotesk",system-ui,sans-serif}
.version-list ul{margin:0;padding-left:18px}
.kbd{font-family:ui-monospace,monospace;font-size:.85em;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>

function fmtMin(m) {
  m = Math.round(+m || 0);
  if (!m) return '';
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '');

function fmtQty(q, unit) {
  if (q == null || q === '' || isNaN(q)) return '';
  q = +q;
  const u = (unit || '').toLowerCase();
  let out;
  if (['g', 'ml', 'gr'].includes(u)) {
    out = q >= 100 ? Math.round(q / 5) * 5 : q >= 10 ? Math.round(q) : Math.round(q * 10) / 10;
  } else if (['kg', 'l'].includes(u)) {
    out = Math.round(q * 100) / 100;
  } else {
    const whole = Math.floor(q), rest = q - whole;
    const steps = [0, 0.25, 0.33, 0.5, 0.67, 0.75, 1];
    let best = 0; steps.forEach((s) => { if (Math.abs(rest - s) < Math.abs(rest - best)) best = s; });
    if (best === 1) return String(whole + 1);
    if (best === 0) return String(whole || (q > 0 ? Math.round(q * 100) / 100 : 0)).replace('.', ',');
    return (whole ? whole : '') + FRAC[best];
  }

}

/* ---------- database (IndexedDB) ---------- */
const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open('incucina', 1);
      rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', { keyPath: 'id' }); };
      rq.onsuccess = () => { this._db = rq.result; res(this._db); };
      rq.onerror = () => rej(rq.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('recipes', mode); const st = t.objectStore('recipes');
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  all() { return this.tx('readonly', (s) => s.getAll()); },
  get(id) { return this.tx('readonly', (s) => s.get(id)); },
  put(r) { return this.tx('readwrite', (s) => s.put(r)); },
  del(id) { return this.tx('readwrite', (s) => s.delete(id)); },
  clear() { return this.tx('readwrite', (s) => s.clear()); }
};

function blankRecipe() {

    equipment: [],
    components: [{ id: uid(), name: '', ingredients: [] }],
    phases: [{ id: uid(), name: '', steps: [] }],
    critical: [], notes: '', storage: '',
    source: { type: 'manual', url: '', author: '', videoId: '' },
    favorite: false, log: [], warnings: []

function newIng(o = {}) { return { id: uid(), qty: o.qty ?? null, unit: o.unit || '', name: o.name || '', prep: o.prep || '', optional: !!o.optional, estimated: !!o.estimated }; }

function num(v) { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }

function normalizeRecipe(r) {

  o.times = Object.assign({ prep: 0, cook: 0, rest: 0 }, o.times || {});
  ['prep', 'cook', 'rest'].forEach((k) => (o.times[k] = num(o.times[k]) || 0));
  o.tags = Array.isArray(o.tags) ? o.tags.filter(Boolean) : [];
  o.equipment = Array.isArray(o.equipment) ? o.equipment.filter(Boolean) : [];

/* Collega gli ingredienti citati in un passaggio (per nome) agli ingredienti della ricetta */
function matchIngredient(r, name) {
  const n = normTxt(name); if (!n) return null;
  const list = allIngredients(r);
  let best = null, score = 0;
  for (const i of list) {
    const m = normTxt(i.name); if (!m) continue;
    let s = 0;
    if (m === n) s = 100;
    else if (m.includes(n) || n.includes(m)) s = 60 + Math.min(m.length, n.length);
    else {
      const a = new Set(n.split(' ').filter((w) => w.length > 2)), bw = m.split(' ').filter((w) => w.length > 2);
      const common = bw.filter((w) => a.has(w)).length; if (common) s = 20 + common * 10;
    }

  }

}

      const st = newStep({ text: typeof s === 'string' ? s : s.text, minutes: num(s.minutes), temp: s.temp || '', cue: s.cue || '', videoAt: num(s.videoAt) });

/* Lettura di una riga ingrediente tipo "200 g farina 00, setacciata" o "Spaghetti 320 g" */
const UNIT_RX = '(kg|g|gr|grammi|mg|ml|cl|dl|l|litri?|cucchiai(?:ni)?|cucchiaio|cucchiaino|cucch\\.?|tazz[ae]|bicchier[ei]|pizzic[oh]i?|spicchi?o?|fogli[ae]|fett[ae]|mazzett[oi]|rametti?o?|pz|pezzi|cups?|tbsp|tsp|oz|lb|q\\.?\\s?b\\.?)';
function parseFraction(s) {
  if (!s) return null;
  s = s.replace('½', '.5').replace('¼', '.25').replace('¾', '.75').trim();
  if (/^\d+\/\d+$/.test(s)) { const [a, b] = s.split('/'); return +a / +b; }
  if (/^\d+\s+\d+\/\d+$/.test(s)) { const [w, f] = s.split(/\s+/); const [a, b] = f.split('/'); return +w + +a / +b; }
  return num(s);
}
function cleanUnit(u) {
  if (!u) return '';
  u = u.toLowerCase().replace(/\s/g, '');
  if (/^q\.?b\.?$/.test(u)) return 'q.b.';
  if (u === 'gr' || u === 'grammi') return 'g';
  if (/^litr/.test(u)) return 'l';
  if (/^cucchiain/.test(u)) return 'cucchiaino';
  if (/^cucch/.test(u)) return 'cucchiaio';
  if (/^tazz/.test(u)) return 'tazza';
  if (/^pizzic/.test(u)) return 'pizzico';
  if (/^spicch/.test(u)) return 'spicchio';
  if (/^fogli/.test(u)) return 'foglia';
  if (/^fett/.test(u)) return 'fetta';
  if (/^mazzett/.test(u)) return 'mazzetto';
  if (u === 'pezzi') return 'pz';
  return u;
}
function parseIngredientLine(line) {
  let s = String(line).replace(/^[\s•\-–*·]+/, '').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  let prep = '';
  const ci = s.indexOf(',');
  let m;
  const NUM = '(\\d+(?:[.,]\\d+)?(?:\\s+\\d+\\/\\d+)?|\\d+\\/\\d+|[½¼¾])';
  // "200 g di farina, setacciata"
  if ((m = s.match(new RegExp('^' + NUM + '\\s*' + UNIT_RX + '?\\.?\\s+(?:di\\s+|d\')?(.+)$', 'i')))) {
    let name = m[3]; const c = name.indexOf(','); if (c > -1) { prep = name.slice(c + 1).trim(); name = name.slice(0, c); }
    return newIng({ qty: parseFraction(m[1]), unit: cleanUnit(m[2]), name: name.trim(), prep });
  }
  // "Spaghetti 320 g" / "Sale q.b."
  if (ci > -1) { prep = s.slice(ci + 1).trim(); s = s.slice(0, ci).trim(); }
  if ((m = s.match(new RegExp('^(.+?)\\s+' + NUM + '\\s*' + UNIT_RX + '?\\.?$', 'i')))) {
    return newIng({ name: m[1].trim(), qty: parseFraction(m[2]), unit: cleanUnit(m[3]), prep });
  }
  if ((m = s.match(/^(.+?)\s+(q\.?\s?b\.?)$/i))) return newIng({ name: m[1].trim(), unit: 'q.b.', prep });
  return newIng({ name: s, prep });
}

/* ---------- foto ---------- */
function compressImage(src, max = 1280, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { res(c.toDataURL('image/jpeg', q)); } catch (e) { rej(e); }
    };
    img.onerror = () => rej(new Error('immagine non leggibile'));
    img.src = src;
  });
}
function fileToDataURL(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
}
async function fileToPhoto(file, max = 1280) { return compressImage(await fileToDataURL(file), max); }
/* Scarica un'immagine da internet (tramite proxy) e la salva dentro la ricetta, così resta anche offline */
async function remoteToPhoto(url) {
  if (!url) return '';
  try {
    const blob = await proxyFetch(url, 'blob');
    if (!blob.type.startsWith('image')) throw new Error('non è un\'immagine');
    const data = await fileToDataURL(blob);
    return await compressImage(data);
  } catch { return url; }
}

/* ---------- accesso al web (proxy CORS pubblici) ---------- */
const PROXIES = [
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  (u) => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)
];
async function fetchTimeout(url, ms = 15000, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, Object.assign({ signal: ctl.signal }, opts)); } finally { clearTimeout(t); }
}
async function proxyFetch(url, as = 'text') {
  let last;
  for (const p of PROXIES) {
    try {
      const r = await fetchTimeout(p(url), 15000);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const out = as === 'blob' ? await r.blob() : as === 'json' ? await r.json() : await r.text();
      if (as === 'text' && (!out || out.length < 200)) throw new Error('pagina vuota');
      return out;
    } catch (e) { last = e; }
  }
  throw last || new Error('non raggiungibile');
}

function detectPlatform(url) {
  let u; try { u = new URL(url); } catch { return null; }
  const h = u.hostname.replace(/^www\.|^m\./, '');
  if (/(^|\.)youtube\.com$|^youtu\.be$/.test(h)) {
    let id = '';
    if (h === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (u.searchParams.get('v')) id = u.searchParams.get('v');
    else { const m = u.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{6,})/); if (m) id = m[2]; }
    return { type: 'youtube', id, url: id ? 'https://www.youtube.com/watch?v=' + id : url };
  }
  if (/tiktok\.com$/.test(h)) return { type: 'tiktok', url };
  if (/(instagram\.com|instagr\.am)$/.test(h)) return { type: 'instagram', url };
  if (/(facebook\.com|fb\.watch|fb\.com)$/.test(h)) return { type: 'facebook', url };
  return { type: 'web', url };
}

function isoDur(s) {
  if (!s || typeof s !== 'string') return 0;
  const m = s.match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  if (!m) return 0;
  return (+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
function findJsonLdRecipe(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const found = [];
  const walk = (o) => {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(walk);
    const t = o['@type']; const types = Array.isArray(t) ? t : [t];
    if (types.includes('Recipe')) found.push(o);
    if (o['@graph']) walk(o['@graph']);
    if (o.mainEntity) walk(o.mainEntity);
  };
  $$('script[type="application/ld+json"]', doc).forEach((s) => { try { walk(JSON.parse(s.textContent.trim())); } catch {} });
  const meta = (p) => { const m = doc.querySelector(`meta[property="${p}"],meta[name="${p}"]`); return m ? m.getAttribute('content') : ''; };
  // testo leggibile della pagina, per l'AI
  $$('script,style,noscript,svg,iframe,header,footer,nav,form,aside', doc).forEach((n) => n.remove());
  $$('br', doc).forEach((n) => n.replaceWith('\n'));
  $$('p,li,div,h1,h2,h3,h4,h5,h6,tr,dt,dd,section,article,figcaption,blockquote', doc).forEach((n) => n.append('\n'));

function fromJsonLd(ld, url) {

  if (m && +m[1] !== r.servings.amount) { fixes.push('porzioni ' + r.servings.amount + ' → ' + m[1]); r.servings.amount = +m[1]; }

/* Video salvato sul telefono: lo carico su Google, l'AI lo guarda e prendo le foto dei passaggi dai fotogrammi */
function videoFrame(url, t, max = 960) {
  return new Promise((res) => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    const done = (x) => { v.removeAttribute('src'); v.load(); res(x); };
    const tm = setTimeout(() => done(''), 8000);
    v.addEventListener('loadedmetadata', () => { v.currentTime = Math.min(Math.max(0, t), Math.max(0, (v.duration || 0) - 0.2)); }, { once: true });
    v.addEventListener('seeked', () => {
      try { const k = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight)); const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); clearTimeout(tm); done(c.toDataURL('image/jpeg', 0.8)); }
      catch { clearTimeout(tm); done(''); }
    }, { once: true });
    v.addEventListener('error', () => { clearTimeout(tm); done(''); }, { once: true });
  });
}
function videoDuration(url) { return new Promise((res) => { const v = document.createElement('video'); v.preload = 'metadata'; v.src = url; v.onloadedmetadata = () => res(v.duration || 0); v.onerror = () => res(0); setTimeout(() => res(0), 6000); }); }
async function importFromVideoFile(file, note, log) {
  if (!AI.has()) throw Object.assign(new Error('Per far guardare il video all\'AI serve la chiave gratuita: inseriscila in Impostazioni.'), { code: 'nokey' });
  const mb = file.size / 1048576;
  const local = URL.createObjectURL(file);
  try {
    const dur = await videoDuration(local);
    const s1 = log('Carico il video (' + mb.toFixed(1) + ' MB' + (dur ? ', ' + mmss(dur) : '') + ')');
    let part = null;
    try { part = { fileData: await AI.upload(file, (i) => { if (i === 2) s1.ok('caricato, Google lo sta elaborando…'); }) }; s1.ok('caricato'); }
    catch (e) {
      if (mb <= 18) { part = { inlineData: { mimeType: file.type || 'video/mp4', data: (await fileToDataURL(file)).split(',')[1] } }; s1.ok('invio diretto'); }
      else { s1.ko(e.message); throw new Error('Non sono riuscito a caricare il video (' + e.message + '). Prova con un video più corto o leggero.'); }
    }
    const s2 = log('L\'AI guarda il video: può volerci un minuto o due');
    const sys = RECIPE_RULES + '\nPer ogni passaggio indica in "videoAt" il secondo del video in cui si vede meglio quel passaggio (numero intero). Usa quello che si vede, che si sente e le scritte a schermo.';
    let res;
    try { res = await AI.generate({ system: sys, parts: [part, { text: 'Trasforma questa video ricetta nel formato richiesto.' + (note ? '\nNote o didascalia del post:\n' + note : '') }], temperature: 0.3, timeoutMs: 300000, maxModels: 3 }); }
    catch (e) { s2.ko(e.message); throw e; }
    if (!res.data || res.data.notARecipe) { s2.ko(); throw new Error('Nel video non ho trovato una ricetta.'); }
    s2.ok();
    const r = fromAiRecipe(res.data, { source: { type: 'video', url: (note.match(/https?:\/\/\S+/) || [''])[0] } });
    if (note) reconcileDoses(r, note);
    const steps = r.phases.flatMap((p) => p.steps).filter((x) => x.videoAt != null).slice(0, 14);
    const s3 = log('Prendo le foto dei passaggi dal video');
    let n = 0;
    for (const st of steps) { const f = await videoFrame(local, st.videoAt, 800); if (f) { st.photo = f; n++; } }
    const last = steps.length ? steps[steps.length - 1].videoAt : (dur || 2) * 0.9;
    r.photo = await videoFrame(local, Math.max(last, (dur || 0) * 0.92), 1280) || (steps[0] && steps[0].photo) || '';
    r.phases.forEach((p) => p.steps.forEach((x) => (x.videoAt = null)));
    s3.ok(n ? n + ' foto' : 'nessuna');
    return r;
  } finally { setTimeout(() => URL.revokeObjectURL(local), 1000); }
}

const Timers = {

  add(label, minutes) {

  },
  remove(id) { this.list = this.list.filter((t) => t.id !== id); this.tick(); },
  tick() {

    this.list.forEach((t) => {
      if (!t.ring && now >= t.end) {
        t.ring = true; beep(); if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 600]);
        try { if (window.Notification && Notification.permission === 'granted') new Notification('⏰ ' + t.label, { body: 'Tempo scaduto!', icon: 'icons/icon-192.png' }); } catch {}

    el.innerHTML = this.list.map((t) => `<div class="tmr ${t.ring ? 'ring' : ''}">${ic('timer')}<span class="lb">${esc(t.label)}</span><span class="tm">${t.ring ? 'Fatto!' : fmtTime((t.end - now) / 1000)}</span><button data-act="timer-stop" data-id="${t.id}" aria-label="Chiudi timer">${ic('x')}</button></div>`).join('');
    if (!this.list.length && this._int) { clearInterval(this._int); this._int = null; }
  }
};

    [0, 0.35, 0.7].forEach((d) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + d; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

async function router() {
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  const app = $('#app');
  if (S.cook && parts[0] !== 'cucina') exitCook(true);
  window.scrollTo(0, 0);
  setMastAction('');
  try {
    if (!parts.length) { setNav('home'); return renderHome(app); }
    switch (parts[0]) {
      case 'r': setNav('home'); return renderRecipe(app, decodeURIComponent(parts[1]));
      case 'cucina': return startCook(decodeURIComponent(parts[1]));
      case 'nuova': setNav('nuova'); return renderEditor(app, null);
      case 'modifica': setNav('home'); return renderEditor(app, decodeURIComponent(parts[1]));
      case 'importa': setNav('importa'); return renderImport(app);
      case 'frigo': setNav('frigo'); return renderFrigo(app);
      case 'consigli': setNav('home'); return renderWizard(app);
      case 'spesa': setNav(''); return renderShop(app);
      case 'impostazioni': setNav('impostazioni'); return renderSettings(app);
      default: location.hash = '#/';
    }
  } catch (e) { console.error(e); app.innerHTML = `<div class="empty">Qualcosa è andato storto: ${esc(e.message)}</div>`; }

async function edSave() {
  const r = S.ed;
  if (!r.title.trim()) { toast('Dai un titolo alla ricetta'); $('[data-p="title"]').focus(); return; }
  // pulizia righe vuote
  r.components.forEach((c) => (c.ingredients = c.ingredients.filter((i) => i.name.trim())));
  r.components = r.components.filter((c, i) => c.ingredients.length || i === 0);
  r.phases.forEach((p) => (p.steps = p.steps.filter((s) => s.text.trim())));
  r.phases = r.phases.filter((p, i) => p.steps.length || i === 0);
  r.critical = r.critical.filter((c) => c.problem.trim());
  const ids = new Set(allIngredients(r).map((i) => i.id));
  r.phases.forEach((p) => p.steps.forEach((s) => (s.uses = s.uses.filter((u) => ids.has(u.ing)))));
  delete r._new;
  r.warnings = [];
  r.updatedAt = Date.now();
  const clean = normalizeRecipe(r);
  try { await DB.put(clean); }
  catch (e) { toast('Salvataggio non riuscito: memoria piena? ' + e.message, 5000); return; }
  await loadRecipes();
  if (S.draft && S.draft.id === clean.id) S.draft = null;
  S.ed = null; S.edDirty = false;
  delete S.view[clean.id];
  toast('Ricetta salvata ✓');
  if (AI.has() && settings.get('auto_nutri', true) && !nutriFresh(clean)) setTimeout(() => ensureNutrition(clean.id), 300);
  location.hash = '#/r/' + encodeURIComponent(clean.id);
}

  has(id) { return this.get().plan.some((p) => p.id === id); },
  add(id, servings) { const d = this.get(); const p = d.plan.find((x) => x.id === id); if (p) p.servings = servings; else d.plan.push({ id, servings }); this.save(d); },

};

function shopAisle(name) { const t = ' ' + normTxt(name) + ' '; for (const [a, rx] of SHOP_AISLES) if (rx.test(t)) return a; return 'Altro'; }
const SHOP_STOP = new Set(['di', 'del', 'della', 'delle', 'dei', 'degli', 'da', 'per', 'fresco', 'fresca', 'freschi', 'fresche', 'intero', 'intera', 'medio', 'media', 'medie', 'medi', 'grande', 'grandi', 'piccolo', 'piccola', 'piccole', 'piccoli', 'q', 'b']);
function shopKey(name) {
  return normTxt(name).split(' ').filter((w) => w && !SHOP_STOP.has(w)).map((w) => w.length > 4 ? w.replace(/(e|i|a|o)$/, '') : w).join(' ');
}
function unitClass(u) {
  u = cleanUnit(u || '');
  if (u === 'g' || u === 'kg' || u === 'mg') return ['g', u === 'kg' ? 1000 : u === 'mg' ? 0.001 : 1];
  if (u === 'ml' || u === 'l' || u === 'cl' || u === 'dl') return ['ml', { l: 1000, cl: 10, dl: 100, ml: 1 }[u]];
  if (!u || u === 'pz') return ['pz', 1];
  if (u === 'q.b.' || u === 'pizzico') return ['qb', 1];
  return [u, 1];
}
function fmtShopQty(q, cls) {
  if (cls === 'g') return q >= 1000 ? fmtQty(Math.round(q / 50) / 20, 'kg') + ' kg' : fmtQty(q, 'g') + ' g';
  if (cls === 'ml') return q >= 1000 ? fmtQty(Math.round(q / 50) / 20, 'l') + ' l' : fmtQty(q, 'ml') + ' ml';
  if (cls === 'pz') return String(Math.ceil(q - 0.001));
  return fmtQty(q, cls) + ' ' + unitLabel(cls, q);
}
function buildShopList() {
  const d = Shop.get();
  const plan = d.plan.map((p) => ({ p, r: S.recipes.find((x) => x.id === p.id) })).filter((x) => x.r);
  const items = new Map();
  plan.forEach(({ p, r }) => {
    const k = (p.servings || r.servings.amount) / (r.servings.amount || 1);
    allIngredients(r).forEach((i) => {
      if (!i.name.trim()) return;
      const [cls, mul] = unitClass(i.unit);
      const key = shopKey(i.name) + '|' + (cls === 'qb' ? 'qb' : cls);
      const it = items.get(key) || { key, name: i.name.trim(), cls, qty: 0, hasQty: false, from: [], optional: true, aisle: shopAisle(i.name) };
      if (i.qty != null && cls !== 'qb') { it.qty += i.qty * mul * k; it.hasQty = true; }
      if (!it.from.includes(r.title)) it.from.push(r.title);
      if (!i.optional) it.optional = false;
      items.set(key, it);
    });
  });
  // un ingrediente "q.b." già presente con una quantità non va ripetuto
  for (const it of [...items.values()]) {
    if (it.cls !== 'qb') continue;
    const base = it.key.split('|')[0];
    const other = [...items.values()].find((x) => x !== it && x.key.split('|')[0] === base);
    if (other) { it.from.forEach((f) => { if (!other.from.includes(f)) other.from.push(f); }); items.delete(it.key); }
  }
  const list = [...items.values()].sort((a, b) => a.name.localeCompare(b.name, 'it'));
  list.forEach((it) => { it.label = it.cls === 'qb' || !it.hasQty ? 'q.b.' : fmtShopQty(it.qty, it.cls); });
  return { plan, list, d };
}
function shopText() {
  const { plan, list, d } = buildShopList();
  const L = ['🛒 Lista della spesa'];
  if (plan.length) L.push('Per: ' + plan.map(({ p, r }) => r.title + ' (' + p.servings + ' ' + r.servings.unit + ')').join(', '));
  const aisles = [...SHOP_AISLES.map((a) => a[0]), 'Altro'];
  aisles.forEach((a) => {
    const its = list.filter((x) => x.aisle === a && !d.checked[x.key]);
    if (!its.length) return;
    L.push('', a.toUpperCase());
    its.forEach((x) => L.push('☐ ' + (x.label === 'q.b.' ? x.name + ' (q.b.)' : x.label + ' ' + x.name) + (x.optional ? ' (facoltativo)' : '')));
  });
  const ex = d.extra.filter((x) => !x.done);
  if (ex.length) { L.push('', 'ALTRO DA PRENDERE'); ex.forEach((x) => L.push('☐ ' + x.text)); }
  L.push('', '— In Cucina con Paolo · GPverse');
  return L.join('\n');
}

      <div class="t"><b>${esc(r.title)}</b><span class="small dim">${esc(label)}</span></div></div>
    <div class="bar"><i style="width:${Math.round((c.i / (total - 1)) * 100)}%"></i></div>
    <div class="body">${body}</div>
    ${c.i <= flat.length ? `<button class="help" data-act="ck-help">${ic('help')} Aiuto!</button>` : ''}
    <div class="bottom">
      <button class="btn" data-act="ck-prev" ${c.i === 0 ? 'disabled' : ''}>${ic('left')} Indietro</button>
      ${c.i <= flat.length ? `<button class="btn primary" data-act="ck-next">${c.i === 0 ? 'Inizia' : c.i === flat.length ? 'Ho finito' : 'Avanti'} ${ic('right')}</button>` : '<span></span>'}
    </div>`;

}
function bindSwipe(el) {
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && !e.target.closest('textarea,input')) cookMove(dx < 0 ? 1 : -1);
  });
}
function cookMove(d) {
  const c = S.cook; if (!c) return;
  if (d > 0 && c.i >= 1 && c.i <= c.flat.length) c.v.steps[c.flat[c.i - 1].s.id] = true;
  c.i = Math.max(0, Math.min(c.flat.length + 1, c.i + d));
  drawCook();
}
function openHelp() {
  const c = S.cook; const step = c.i >= 1 && c.i <= c.flat.length ? c.flat[c.i - 1].s : null;
  const quick = ['È troppo liquido', 'È troppo denso', 'Si sta attaccando', 'Sta bruciando', 'È insipido', 'È troppo salato', 'Non si addensa', 'Non lievita', 'Mi manca un ingrediente', 'Ho sbagliato una dose'];
  const m = openModal('Aiuto in cucina', `
    <p class="small dim" style="margin-top:0">Calma: quasi tutto si recupera. Cosa sta succedendo${step ? ' in questo passaggio' : ''}?</p>
    <div class="chips" style="margin-bottom:10px">${quick.map((q) => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join('')}</div>
    <textarea id="helpTxt" rows="3" placeholder="Descrivi il problema con parole tue"></textarea>
    <button class="btn primary block" id="helpGo" style="margin-top:10px">${ic('sparkle')} Cosa faccio?</button>
    <div id="helpOut" class="ai-answer" style="margin-top:12px"></div>`, (m) => {
    $$('.chip[data-q]', m).forEach((ch) => (ch.onclick = () => { const t = $('#helpTxt', m); t.value = (t.value ? t.value + '. ' : '') + ch.dataset.q; }));
    $('#helpGo', m).onclick = async () => {

      if (!AI.has()) { $('#helpOut', m).innerHTML = `<div class="notice">Per l'aiuto serve la chiave AI gratuita (Impostazioni).</div>`; return; }
      $('#helpGo', m).disabled = true; $('#helpOut', m).innerHTML = `<span class="dim">Ci penso…</span>`;

      finally { $('#helpGo', m).disabled = false; }
    };
  });
}

async function fillModels() {
  try {

    const cur = settings.get('gemini_model', 'auto');
    const best = AI.pickBest(list);
    sel.innerHTML = `<option value="auto">Automatico (${esc(best)})</option>` + list.filter((n) => /^gemini/.test(n)).map((n) => `<option value="${esc(n)}" ${n === cur ? 'selected' : ''}>${esc(n)}</option>`).join('');
  } catch {}
}
async function testKey() {
  const out = $('#keyOut');

    await AI.models(true);

async function importBackup(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const list = Array.isArray(j) ? j : j.recipes || (j.title ? [j] : []);
    if (!list.length) throw new Error('nessuna ricetta nel file');
    let n = 0;
    for (const r of list) { await DB.put(normalizeRecipe(r)); n++; }
    await loadRecipes();
    toast(n + (n === 1 ? ' ricetta importata' : ' ricette importate') + ' ✓');
    renderSettings($('#app'));
  } catch (err) { toast('File non valido: ' + err.message, 4000); }
}
function applyTheme() {

    const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; const saved = S.recipes.some((x) => x.id === r.id);
    openModal(r.title, `<div class="menu-list">
      <button class="btn" data-act="r-share" data-id="${r.id}">${ic('share')} Condividi come testo</button>
      <button class="btn" data-act="r-copy" data-id="${r.id}">${ic('copy')} Copia testo</button>
      <button class="btn" data-act="r-json" data-id="${r.id}">${ic('dl')} Esporta file ricetta</button>
      ${saved ? `<button class="btn" data-act="r-dup" data-id="${r.id}">${ic('plus')} Duplica</button>
      <button class="btn danger" data-act="r-del" data-id="${r.id}">${ic('trash')} Elimina</button>` : ''}</div>`);
  },
  'r-share': async (a) => {
    const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; const k = scaleOf(r, S.view[r.id] || {});
    const text = recipeToText(r, k);
    if (navigator.share) { try { await navigator.share({ title: r.title, text }); } catch {} }
    else { await navigator.clipboard.writeText(text).catch(() => {}); toast('Testo copiato'); }
    closeModal();
  },
  'r-copy': async (a) => { const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; try { await navigator.clipboard.writeText(recipeToText(r, scaleOf(r, S.view[r.id] || {}))); toast('Testo copiato ✓'); } catch { toast('Copia non riuscita'); } closeModal(); },
  'r-json': (a) => { const r = S.recipes.find((x) => x.id === a.dataset.id) || S.draft; downloadFile(slug(r.title) + '.ricetta.json', JSON.stringify(r)); closeModal(); },
  'r-dup': async (a) => { const r = clone(S.recipes.find((x) => x.id === a.dataset.id)); r.id = uid(); r.title += ' (copia)'; r.createdAt = r.updatedAt = Date.now(); r.log = []; await DB.put(r); await loadRecipes(); closeModal(); location.hash = '#/modifica/' + r.id; },
  'r-del': async (a) => { closeModal(); if (!(await confirmBox('Eliminare questa ricetta? Non si può annullare.', 'Elimina', true))) return; await DB.del(a.dataset.id); Shop.remove(a.dataset.id); await loadRecipes(); toast('Ricetta eliminata'); location.hash = '#/'; },
  // editor
  'ed-cancel': async () => {
    if (S.edDirty && !(await confirmBox('Uscire senza salvare le modifiche?', 'Esci senza salvare', true))) return;
    const id = S.ed && S.ed.id; const wasDraft = S.draft && S.draft.id === id;
    S.ed = null; S.edDirty = false;
    if (wasDraft) { const fromFrigo = S.draft.source.type === 'ai'; S.draft = null; location.hash = fromFrigo ? '#/frigo' : '#/importa'; }
    else if (id && S.recipes.some((x) => x.id === id)) location.hash = '#/r/' + encodeURIComponent(id);
    else location.hash = '#/';
  },
  'ed-save': () => edSave(),
  'ed-photo-del': () => { S.ed.photo = ''; S.edDirty = true; edRedraw(); },
  'ed-eq-add': () => edAddEq(),
  'ed-eq-del': (a) => { S.ed.equipment.splice(+a.dataset.i, 1); S.edDirty = true; edRedraw(); },
  'ed-grp-add': () => { S.ed.components.push({ id: uid(), name: '', ingredients: [newIng()] }); S.edDirty = true; edRedraw(); },
  'ed-grp-del': (a) => { S.ed.components.splice(+a.dataset.ci, 1); S.edDirty = true; edRedraw(); },
  'ed-ing-add': (a) => { const c = S.ed.components[+a.dataset.ci]; c.ingredients.push(newIng()); S.edDirty = true; edRedraw(`ing-${a.dataset.ci}-${c.ingredients.length - 1}`); },
  'ed-ing-del': (a) => { S.ed.components[+a.dataset.ci].ingredients.splice(+a.dataset.ii, 1); S.edDirty = true; edRedraw(); },
  'ed-ing-mv': (a) => {
    const ci = +a.dataset.ci, ii = +a.dataset.ii; const list = S.ed.components[ci].ingredients;
    if (ii > 0) { [list[ii - 1], list[ii]] = [list[ii], list[ii - 1]]; }
    else if (ci > 0) { const it = list.splice(0, 1)[0]; S.ed.components[ci - 1].ingredients.push(it); }
    S.edDirty = true; edRedraw();
  },
  'ed-ing-paste': (a) => {
    const ci = +a.dataset.ci;
    const m = openModal('Incolla elenco ingredienti', `<p class="small dim" style="margin-top:0">Un ingrediente per riga, ad esempio:<br><span class="kbd">200 g farina 00, setacciata</span><br><span class="kbd">Uova 2</span><br><span class="kbd">Sale q.b.</span></p><textarea id="pasteIng" rows="8"></textarea><button class="btn primary block" style="margin-top:10px" id="pasteGo">Aggiungi</button>`);
    $('#pasteGo', m).onclick = () => {
      const lines = $('#pasteIng', m).value.split('\n').map(parseIngredientLine).filter(Boolean);
      const c = S.ed.components[ci]; c.ingredients = c.ingredients.filter((i) => i.name.trim()).concat(lines);
      S.edDirty = true; closeModal(); edRedraw(); toast(lines.length + ' ingredienti aggiunti');
    };
  },
  'ed-ph-add': () => { S.ed.phases.push({ id: uid(), name: '', steps: [newStep()] }); S.edDirty = true; edRedraw(); },
  'ed-ph-del': (a) => { S.ed.phases.splice(+a.dataset.pi, 1); S.edDirty = true; edRedraw(); },
  'ed-st-add': (a) => { const p = S.ed.phases[+a.dataset.pi]; p.steps.push(newStep()); S.edDirty = true; edRedraw(`st-${a.dataset.pi}-${p.steps.length - 1}`); },
  'ed-st-del': (a) => { S.ed.phases[+a.dataset.pi].steps.splice(+a.dataset.si, 1); S.edDirty = true; edRedraw(); },
  'ed-st-mv': (a) => {
    const pi = +a.dataset.pi, si = +a.dataset.si, d = +a.dataset.d; const ph = S.ed.phases;
    const list = ph[pi].steps; const j = si + d;
    if (j >= 0 && j < list.length) [list[si], list[j]] = [list[j], list[si]];
    else if (j < 0 && pi > 0) ph[pi - 1].steps.push(list.splice(si, 1)[0]);
    else if (j >= list.length && pi < ph.length - 1) ph[pi + 1].steps.unshift(list.splice(si, 1)[0]);
    S.edDirty = true; edRedraw();
  },
  'ed-st-photo-del': (a) => { S.ed.phases[+a.dataset.pi].steps[+a.dataset.si].photo = ''; S.edDirty = true; edRedraw(); },
  'ed-use': (a) => {
    const s = S.ed.phases[+a.dataset.pi].steps[+a.dataset.si]; const id = a.dataset.ing;
    const i = s.uses.findIndex((u) => u.ing === id);
    if (i > -1) s.uses.splice(i, 1); else s.uses.push({ ing: id, qty: null });
    a.classList.toggle('on'); S.edDirty = true;
  },
  'ed-cr-add': () => { S.ed.critical.push({ problem: '', fix: '' }); S.edDirty = true; edRedraw(); },
  'ed-cr-del': (a) => { S.ed.critical.splice(+a.dataset.i, 1); S.edDirty = true; edRedraw(); },
  // import
  'imp-tab': (a) => { S.importTab = a.dataset.t; renderImport($('#app')); },
  'imp-paste': async () => { try { const t = await navigator.clipboard.readText(); $('#impUrl').value = (t.match(/https?:\/\/\S+/) || [t])[0]; } catch { toast('Tieni premuto nel campo e scegli Incolla'); } },
  'imp-go': () => { S.importPick = null; runImport('link'); },
  'imp-pick': (a) => { S.importPick = a.dataset.t; runImport('link'); },
  'imp-text': () => runImport('text'),
  'imp-photo': () => runImport('photo'),
  'imp-video': () => runImport('video'),
  // frigo
  'fr-add': () => frAdd(),
  'fr-sug': (a) => { const f = frigoState(); f.items.push(a.dataset.v); saveFrigo(); frRedraw(); },
  'fr-del': (a) => { frigoState().items.splice(+a.dataset.i, 1); saveFrigo(); frRedraw(); },
  'fr-clear': () => { frigoState().items = []; saveFrigo(); frRedraw(); },
  'fr-tool': (a) => { const f = frigoState(); const v = a.dataset.v; f.tools = f.tools.includes(v) ? f.tools.filter((x) => x !== v) : f.tools.concat(v); saveFrigo(); a.classList.toggle('on'); },
  'fr-time': (a) => { frigoState().time = +a.dataset.v; saveFrigo(); $$('[data-act="fr-time"]').forEach((b) => b.classList.toggle('on', b === a)); },
  'fr-ppl': (a) => { const f = frigoState(); f.people = Math.max(1, Math.min(20, f.people + +a.dataset.d)); saveFrigo(); a.parentElement.querySelector('.v').textContent = f.people; },
  'fr-kind': (a) => { frigoState().kind = a.dataset.v; $$('[data-act="fr-kind"]').forEach((b) => b.classList.toggle('on', b === a)); },
  'fr-pantry-edit': (a, e) => {
    e.preventDefault(); const f = frigoState();
    const m = openModal('Dispensa base', `<p class="small dim" style="margin-top:0">Le cose che hai sempre in casa, separate da virgola.</p><textarea id="pantryIn" rows="4">${esc(f.pantry.join(', '))}</textarea><button class="btn primary block" style="margin-top:10px" id="pantryGo">Salva</button>`);
    $('#pantryGo', m).onclick = () => { f.pantry = $('#pantryIn', m).value.split(',').map((s) => s.trim()).filter(Boolean); saveFrigo(); closeModal(); frRedraw(); };
  },
  'fr-go': () => frSearch(false),
  'fr-more': () => frSearch(true),
  'fr-make': async (a) => {
    const idea = S.frigoIdeas[+a.dataset.i]; a.disabled = true; a.innerHTML = ic('refresh', 'spin') + ' Scrivo la ricetta…';
    try { const r = await fridgeRecipe(idea, frigoState()); S.draft = r; S.ed = null; location.hash = '#/r/' + encodeURIComponent(r.id); }
    catch (e) { toast(e.message, 4000); a.disabled = false; a.innerHTML = ic('chef') + ' Fammi la ricetta'; }
  },
  'fr-import': (a) => { const idea = S.frigoIdeas[+a.dataset.i]; S.importTab = 'link'; S.importUrl = idea.sourceUrl; S.autoImport = true; location.hash = '#/importa'; },
  // cucina
  'ck-close': () => exitCook(),
  'ck-next': () => cookMove(1),
  'ck-prev': () => cookMove(-1),
  'ck-ing': (a) => { const v = S.cook.v; v.ings[a.dataset.i] = !v.ings[a.dataset.i]; drawCook(); },
  'ck-eq': (a) => { const v = S.cook.v; v.eq[a.dataset.i] = !v.eq[a.dataset.i]; drawCook(); },
  'ck-rate': (a) => { S.cook.rating = +a.dataset.v; $$('.rate button').forEach((b, i) => b.classList.toggle('on', i < S.cook.rating)); },
  'ck-help': () => openHelp(),
  'ck-finish': async () => {
    const c = S.cook; const note = ($('#ckNote') || {}).value || '';
    const saved = S.recipes.find((x) => x.id === c.r.id);
    if (saved) { saved.log.push({ date: Date.now(), rating: c.rating, note: note.trim() }); await DB.put(saved); toast('Salvato nel diario ✓'); }
    S.view[c.r.id] = Object.assign(newView(c.r), { servings: c.v.servings });
    exitCook();
  },
  // impostazioni
  'key-show': () => { const i = $('#keyIn'); i.type = i.type === 'password' ? 'text' : 'password'; },
  'key-save': () => { const v = $('#keyIn').value.trim(); settings.set('gemini_key', v); settings.set('gemini_models', null); if (v) testKey(); else toast('Chiave rimossa'); },
  'key-del': () => { settings.set('gemini_key', ''); settings.set('gemini_models', null); renderSettings($('#app')); toast('Chiave rimossa'); },
  'bk-export': () => { downloadFile('incucina-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app: 'incucina', version: APP_VERSION, date: Date.now(), recipes: S.recipes })); },
  'bk-wipe': async () => { if (!(await confirmBox('Cancellare TUTTE le ricette da questo dispositivo? Fai prima un backup.', 'Cancella tutto', true))) return; await DB.clear(); await loadRecipes(); renderSettings($('#app')); toast('Ricette cancellate'); },
  'theme': (a) => { settings.set('theme', a.dataset.v); applyTheme(); renderSettings($('#app')); }
};
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const fn = ACT[a.dataset.act];
  if (fn) { if ((a.tagName === 'A' && a.getAttribute('href') === '#') || (a.tagName !== 'A' && a.closest('a'))) { e.preventDefault(); e.stopPropagation(); } fn(a, e); }
});
// campo persone: ricalcolo appena smetti di scrivere (o con Invio)
let servTimer = null, servRefocus = false;
function applyServ(el) {
  const n = Math.round(num(el.value)); const id = el.dataset.serv; const inCook = !!el.closest('#cook');
  const v = inCook ? (S.cook && S.cook.v) : S.view[id]; if (!v) return;
  if (!n || n < 1 || n > 200) { el.value = v.servings; return; }
  if (v.servings === n) return;
  const hadFocus = document.activeElement === el;
  v.servings = n;
  if (inCook) drawCook(); else rerenderRecipe(id);
  const again = $((inCook ? '#cook ' : '#app ') + 'input[data-serv]');
  if (again && hadFocus) { servRefocus = true; again.focus(); servRefocus = false; try { const L = again.value.length; again.setSelectionRange(L, L); } catch {} }
}
document.addEventListener('input', (e) => {
  const el = e.target; if (el.dataset.serv === undefined) return;
  clearTimeout(servTimer); servTimer = setTimeout(() => applyServ(el), 600);
});
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset.serv === undefined) return; clearTimeout(servTimer); applyServ(el); });
document.addEventListener('keydown', (e) => { const el = e.target; if (e.key === 'Enter' && el.dataset && el.dataset.serv !== undefined) { clearTimeout(servTimer); applyServ(el); el.blur(); } });
document.addEventListener('focusin', (e) => { if (!servRefocus && e.target.dataset && e.target.dataset.serv !== undefined) e.target.select(); });
document.addEventListener('input', (e) => { const el = e.target; if (el.dataset && el.dataset.wz && S.wz) setPath(S.wz, el.dataset.wz, el.value); });
// input nell'editor: scrive direttamente nella ricetta in modifica
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!S.ed || !el.closest('#app')) return;
  if (el.dataset.p) {
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num !== undefined) v = num(v);
    setPath(S.ed, el.dataset.p, v); S.edDirty = true;
    if (/^times\./.test(el.dataset.p)) { const tot = $$('.ed-grid4 input[disabled]')[0]; if (tot) tot.value = fmtMin(totalMin(S.ed)) || '—'; }
  } else if (el.dataset.tags !== undefined) {
    S.ed.tags = el.value.split(',').map((s) => s.trim()).filter(Boolean); S.edDirty = true;
  }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.p && el.type === 'checkbox' && S.ed) { setPath(S.ed, el.dataset.p, el.checked); S.edDirty = true; return; }
  if (!el.dataset.photo || !S.ed || !el.files[0]) return;
  try {
    const d = await fileToPhoto(el.files[0]);
    if (el.dataset.photo === 'cover') S.ed.photo = d;
    else S.ed.phases[+el.dataset.pi].steps[+el.dataset.si].photo = d;
    S.edDirty = true; edRedraw();
  } catch (err) { toast('Foto non leggibile'); }
});
document.addEventListener('keydown', (e) => {
  if (!S.cook || e.target.closest('textarea,input')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); cookMove(1); }
  if (e.key === 'ArrowLeft') cookMove(-1);
  if (e.key === 'Escape') exitCook();
});
window.addEventListener('beforeunload', (e) => { if (S.edDirty) { e.preventDefault(); e.returnValue = ''; } });

/* =========================================================
   AVVIO
   ========================================================= */
(async function init() {
  applyTheme();
  markVer();
  try { await loadRecipes(); } catch (e) { $('#app').innerHTML = `<div class="empty">Il browser non permette di salvare dati (modalità privata?). ${esc(e.message)}</div>`; }
  // link condiviso da altre app (Condividi → In Cucina)
  const qs = new URLSearchParams(location.search);
  const shared = [qs.get('url'), qs.get('text'), qs.get('title')].filter(Boolean).join(' ');
  const link = shared.match(/https?:\/\/\S+/);
  if (link) {
    history.replaceState(null, '', location.pathname + '#/importa');
    S.importTab = 'link'; S.importUrl = link[0]; S.autoImport = true;
    S.importHint = shared.replace(/https?:\/\/\S+/g, ' ').replace(/\s+/g, ' ').trim();
    await router();
  } else await router();
  window.addEventListener('hashchange', router);
  if (!link) setTimeout(showWhatsNew, 400);
  // controllo silenzioso all'avvio (al massimo ogni 6 ore): se c'è una versione nuova lo segnala
  if (location.protocol.startsWith('http') && Date.now() - settings.get('upd_checked', 0) > 6 * 3600e3) {
    setTimeout(async () => { await checkUpdate(true); if (updAvailable()) toastAction('È disponibile la v' + Upd.latest.version, 'Vedi', openVersions); }, 2500);
  }
  // pulisce il ?v= lasciato dall'installazione di un aggiornamento
  if (/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
